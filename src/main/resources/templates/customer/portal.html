<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng khách hàng - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
    <link rel="stylesheet" th:href="@{/css/roles/customer/portal.css}">
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>

<main class="customer-portal customer-app-content">
    <div class="customer-shell">
        <section class="customer-panel customer-header">
            <div>
                <p class="management-eyebrow">Cổng khách hàng</p>
                <h1 th:text="${customer.fullName != null ? customer.fullName : customer.email}">Khách hàng</h1>
                <p>Theo dõi hợp đồng đã gửi và ký hợp đồng trực tuyến.</p>
            </div>
        </section>

        <section class="customer-panel customer-table-wrap">
            <table class="customer-table">
                <thead>
                <tr>
                    <th>Mã hợp đồng</th>
                    <th>Trạng thái</th>
                    <th>Giá trị</th>
                    <th>Ngày tạo</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contract : ${contracts}">
                    <td><strong th:text="${contract.contractCode}">CT-001</strong></td>
                    <td th:text="${contract.status == 'SENT_TO_CUSTOMER' ? 'Đã gửi khách hàng' : (contract.status == 'SIGNED' ? 'Đã ký' : (contract.status == 'CANCELLED' ? 'Đã hủy' : contract.status))}">Đã gửi khách hàng</td>
                    <td th:text="${contract.finalAmount != null ? #numbers.formatDecimal(contract.finalAmount, 0, 'COMMA', 0, 'POINT') : '0'}">0</td>
                    <td th:text="${contract.createdAt != null ? #temporals.format(contract.createdAt, 'dd/MM/yyyy') : 'Chưa có'}">Chưa có</td>
                    <td>
                        <a class="customer-button secondary" th:href="@{/customer/portal/contracts/{id}(id=${contract.id})}">
                            Xem
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contracts)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có hợp đồng nào.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
</body>
</html>
