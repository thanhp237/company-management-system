<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo của tôi - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>

<main class="admin-workspace customer-app-content">
    <div class="notification-page customer-notification-page">
        <div class="notification-page-head">
            <div>
                <span class="notification-eyebrow">Cổng khách hàng / Thông báo</span>
                <h1>Thông báo của tôi</h1>
                <p>Các cập nhật về báo giá, hợp đồng, hóa đơn và thanh toán.</p>
            </div>
            <a th:href="@{/customer/portal}" class="btn btn-outline-secondary notification-back-btn">
                <i class="fas fa-arrow-left"></i> Trang chính
            </a>
        </div>

        <section class="notification-list-shell">
            <div th:if="${#lists.isEmpty(notifications)}" class="notification-empty-state">
                <i class="far fa-bell-slash"></i>
                <strong>Chưa có thông báo</strong>
                <span>Khi có cập nhật mới, hệ thống sẽ hiển thị tại đây.</span>
            </div>

            <div th:if="${!#lists.isEmpty(notifications)}" class="notification-list">
                <article th:each="noti : ${notifications}"
                         th:id="'noti-row-' + ${noti.id}"
                         class="notification-list-item"
                         th:classappend="${!noti.isRead} ? ' unread' : ''">
                    <div class="notification-list-icon">
                        <i th:class="${!noti.isRead} ? 'fas fa-envelope' : 'far fa-envelope-open'"></i>
                    </div>
                    <div class="notification-list-body">
                        <div class="notification-list-title-row">
                            <strong th:text="${noti.title}">Tiêu đề</strong>
                            <span th:if="${!noti.isRead}" class="badge rounded-pill text-bg-primary">Mới</span>
                        </div>
                        <p th:text="${noti.message}">Nội dung thông báo</p>
                        <time>
                            <i class="far fa-clock"></i>
                            <span th:text="${#temporals.format(noti.createdAt, 'HH:mm - dd/MM/yyyy')}">Thời gian</span>
                        </time>
                    </div>
                    <button th:if="${!noti.isRead}"
                            type="button"
                            data-notification-read-action
                            th:onclick="'window.AppNotifications ? window.AppNotifications.markCustomerInPage(' + ${noti.id} + ') : markCustomerAsReadInPage(' + ${noti.id} + ')'"
                            class="btn btn-sm btn-outline-success notification-read-btn">
                        <i class="fas fa-check"></i> Đã đọc
                    </button>
                </article>
            </div>
        </section>
    </div>
</main>

<script>
function markCustomerAsReadInPage(notiId) {
    fetch('/api/notifications/customer/' + notiId + '/read', { method: 'POST' })
        .then(function(response) {
            if (!response.ok) return;
            const row = document.getElementById('noti-row-' + notiId);
            if (!row) return;
            row.classList.remove('unread');
            const action = row.querySelector('[data-notification-read-action]');
            if (action) action.remove();
            const badge = row.querySelector('.badge');
            if (badge) badge.remove();
            const icon = row.querySelector('.notification-list-icon i');
            if (icon) icon.className = 'far fa-envelope-open';
        })
        .catch(function(error) { console.error('Lỗi đánh dấu đã đọc:', error); });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
