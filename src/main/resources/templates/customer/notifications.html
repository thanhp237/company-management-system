<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo của tôi - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f8fb;
        }
        .noti-list-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #dfe7e2;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(31, 45, 57, 0.04);
        }
        .noti-item-box {
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #eef2f5;
            background: #fff;
            transition: all 0.3s;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }
        .noti-item-box.unread {
            background: #f2f7fc;
            border-color: #d2e4f5;
        }
        .noti-item-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .noti-icon {
            font-size: 1.5rem;
            color: #008a45;
        }
        .noti-item-box.unread .noti-icon {
            color: #005f32;
        }
        .noti-time {
            font-size: 11px;
            color: #8898a9;
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>

<main class="admin-workspace customer-app-content">
    <div class="container-fluid py-4" style="max-width: 900px; margin: 0 auto;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 fw-bold"><i class="fas fa-bell text-success me-2"></i>Thông báo của tôi</h1>
            <a th:href="@{/customer/portal}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Trang chính</a>
        </div>

        <div class="noti-list-card">
            <div th:each="noti : ${notifications}" 
                 th:classappend="${!noti.isRead} ? 'unread' : ''" 
                 class="noti-item-box"
                 th:onclick="'markAsReadAndRedirect(' + ${noti.id} + ')'"
                 style="cursor: pointer;">
                <div class="noti-icon mt-1">
                    <i class="fas fa-envelope-open-text" th:if="${noti.isRead}"></i>
                    <i class="fas fa-envelope" th:if="${!noti.isRead}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h5 class="fw-bold mb-0 text-dark" style="font-size: 15px;" th:text="${noti.title}">Tiêu đề</h5>
                        <span class="noti-time" th:text="${#temporals.format(noti.createdAt, 'dd/MM/yyyy HH:mm')}">14/07/2026 12:00</span>
                    </div>
                    <p class="text-muted mb-0" style="font-size: 13px; line-height: 1.5;" th:text="${noti.message}">Nội dung thông báo</p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                <i class="far fa-bell-slash fa-3x mb-3"></i>
                <p class="mb-0">Bạn không có thông báo nào.</p>
            </div>
        </div>
    </div>
</main>

<script>
    function markAsReadAndRedirect(notiId) {
        fetch('/api/notifications/' + notiId + '/read', { method: 'POST' })
            .then(() => {
                window.location.reload();
            })
            .catch(err => console.error('Lỗi đánh dấu đã đọc:', err));
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
