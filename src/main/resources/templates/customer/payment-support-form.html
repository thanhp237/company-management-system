<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu hỗ trợ thanh toán - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
    <link rel="stylesheet" th:href="@{/css/roles/customer/portal.css}">
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>
<main class="admin-workspace customer-app-content">
    <div class="management-page support-shell">
        <a class="btn btn-outline-secondary mb-3" th:href="@{/customer/portal/payments}">
            <i class="fas fa-arrow-left"></i>
            Quay lại thanh toán
        </a>

        <section class="support-card">
            <h1>Yêu cầu hỗ trợ thanh toán</h1>
            <p>Gửi minh chứng nếu bạn đã thanh toán qua VNPAY nhưng hóa đơn chưa chuyển sang trạng thái thành công.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Có lỗi xảy ra.
            </div>

            <div class="support-invoice">
                <div>
                    <span>Mã hóa đơn</span>
                    <strong th:text="${invoice.invoiceCode}">INV</strong>
                </div>
                <div>
                    <span>Hợp đồng</span>
                    <strong th:text="${invoice.contract.contractCode}">CT</strong>
                </div>
                <div>
                    <span>Trạng thái</span>
                    <strong th:text="${invoice.status}">ISSUED</strong>
                </div>
            </div>

            <form class="support-form"
                  th:action="@{/customer/portal/payments/{id}/support(id=${invoice.id})}"
                  method="post"
                  enctype="multipart/form-data">
                <label>
                    Tiêu đề
                    <input class="form-control"
                           type="text"
                           name="title"
                           th:value="${titleValue}"
                           placeholder="VD: Đã thanh toán nhưng hóa đơn chưa cập nhật"
                           required>
                </label>

                <label>
                    Nội dung
                    <textarea class="form-control"
                              name="content"
                              rows="6"
                              th:text="${contentValue}"
                              placeholder="Mô tả thời gian thanh toán, ngân hàng, mã giao dịch hoặc tình trạng bạn đang gặp..."
                              required></textarea>
                </label>

                <label>
                    Ảnh minh chứng
                    <input class="form-control"
                           type="file"
                           name="imageFile"
                           accept="image/png,image/jpeg">
                    <small class="text-muted">Chỉ hỗ trợ JPG/PNG, tối đa 5MB.</small>
                </label>

                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/customer/portal/payments}">Hủy</a>
                    <button class="btn btn-primary" type="submit">
                        <i class="fas fa-paper-plane"></i>
                        Gửi hỗ trợ
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
