<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu hỗ trợ thanh toán - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <style>
        body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .support-shell { max-width: 820px; }
        .support-card { border: 1px solid #dfe7e2; border-radius: 8px; background: #fff; padding: 24px; box-shadow: 0 18px 42px rgba(31, 45, 57, 0.08); }
        .support-card h1 { margin: 0; font-size: 28px; font-weight: 900; color: #101923; }
        .support-card p { color: #657386; }
        .support-invoice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0; padding: 16px; border-radius: 8px; background: #f7faf8; }
        .support-invoice span { display: block; color: #657386; font-size: 12px; font-weight: 800; text-transform: uppercase; }
        .support-invoice strong { display: block; margin-top: 4px; color: #101923; }
        .support-form label { display: block; margin-bottom: 16px; font-weight: 800; color: #263746; }
        .support-form input, .support-form textarea { margin-top: 8px; }
        @media (max-width: 720px) { .support-invoice { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>
<main class="admin-workspace customer-app-content">
    <div class="management-page support-shell">
        <a class="btn btn-outline-secondary mb-3" th:href="@{/customer/portal/payments}">
            <i class="fas fa-arrow-left"></i>
            Quay lại thanh toán
        </a>

        <section class="support-card">
            <h1>Yêu cầu hỗ trợ thanh toán</h1>
            <p>Gửi minh chứng nếu bạn đã thanh toán qua VNPAY nhưng hóa đơn chưa chuyển sang trạng thái thành công.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Có lỗi xảy ra.
            </div>

            <div class="support-invoice">
                <div>
                    <span>Mã hóa đơn</span>
                    <strong th:text="${invoice.invoiceCode}">INV</strong>
                </div>
                <div>
                    <span>Hợp đồng</span>
                    <strong th:text="${invoice.contract.contractCode}">CT</strong>
                </div>
                <div>
                    <span>Trạng thái</span>
                    <strong th:text="${invoice.status}">ISSUED</strong>
                </div>
            </div>

            <form class="support-form"
                  th:action="@{/customer/portal/payments/{id}/support(id=${invoice.id})}"
                  method="post"
                  enctype="multipart/form-data">
                <label>
                    Tiêu đề
                    <input class="form-control"
                           type="text"
                           name="title"
                           th:value="${titleValue}"
                           placeholder="VD: Đã thanh toán nhưng hóa đơn chưa cập nhật"
                           required>
                </label>

                <label>
                    Nội dung
                    <textarea class="form-control"
                              name="content"
                              rows="6"
                              th:text="${contentValue}"
                              placeholder="Mô tả thời gian thanh toán, ngân hàng, mã giao dịch hoặc tình trạng bạn đang gặp..."
                              required></textarea>
                </label>

                <label>
                    Ảnh minh chứng
                    <input class="form-control"
                           type="file"
                           name="imageFile"
                           accept="image/png,image/jpeg">
                    <small class="text-muted">Chỉ hỗ trợ JPG/PNG, tối đa 5MB.</small>
                </label>

                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/customer/portal/payments}">Hủy</a>
                    <button class="btn btn-primary" type="submit">
                        <i class="fas fa-paper-plane"></i>
                        Gửi hỗ trợ
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
