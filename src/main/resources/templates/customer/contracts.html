<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hợp đồng của tôi - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .customer-contracts {
            min-height: calc(100vh - 72px);
            padding: 28px;
            background: #f5f8fb;
        }

        .customer-shell {
            width: min(1060px, 100%);
            margin: 0 auto;
        }

        .customer-panel {
            border: 1px solid #dfe7e2;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 42px rgba(31, 45, 57, 0.08);
        }

        .customer-header {
            padding: 22px;
            margin-bottom: 18px;
        }

        .customer-header h1 {
            margin: 0;
            color: #101923;
            font-size: 30px;
            font-weight: 900;
        }

        .customer-header p {
            margin: 8px 0 0;
            color: #657386;
        }

        .customer-table {
            width: 100%;
            margin: 0;
        }

        .customer-table th {
            padding: 14px 16px;
            background: #f7faf8;
            color: #405366;
            font-size: 12px;
            text-transform: uppercase;
        }

        .customer-table td {
            padding: 14px 16px;
            border-top: 1px solid #edf1ee;
            vertical-align: middle;
        }

        .customer-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 38px;
            padding: 0 14px;
            border-radius: 8px;
            background: #e8f3ff;
            color: #1c69b3;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>

<main class="customer-contracts customer-app-content">
    <div class="customer-shell">
        <section class="customer-panel customer-header">
            <p class="management-eyebrow">Cổng khách hàng</p>
            <h1>Hợp đồng của tôi</h1>
            <p th:text="${customer.email}">customer@example.com</p>
        </section>

        <section class="customer-panel">
            <table class="customer-table">
                <thead>
                <tr>
                    <th>Mã hợp đồng</th>
                    <th>Báo giá</th>
                    <th>Trạng thái</th>
                    <th>Tổng giá trị</th>
                    <th>Ngày ký</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contract : ${contracts}">
                    <td><strong th:text="${contract.contractCode}">CT-001</strong></td>
                    <td th:text="${contract.quotationCode != null ? contract.quotationCode : 'Chưa có'}">QT-001</td>
                    <td th:text="${contract.status == 'SENT_TO_CUSTOMER' ? 'Đã gửi khách hàng' : (contract.status == 'SIGNED' ? 'Đã ký' : (contract.status == 'CANCELLED' ? 'Đã hủy' : contract.status))}">Đã gửi khách hàng</td>
                    <td th:text="${contract.finalAmount != null ? #numbers.formatDecimal(contract.finalAmount, 0, 'COMMA', 0, 'POINT') : '0'}">0</td>
                    <td th:text="${contract.signedAt != null ? #temporals.format(contract.signedAt, 'dd/MM/yyyy HH:mm') : 'Chưa ký'}">Chưa ký</td>
                    <td>
                        <a class="customer-button" th:href="@{/customer/portal/contracts/{id}(id=${contract.id})}">
                            <i class="fas fa-eye"></i>
                            Xem
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contracts)}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có hợp đồng nào.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
</body>
</html>
