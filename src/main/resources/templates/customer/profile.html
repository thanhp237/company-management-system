<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ khách hàng - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>
<main class="admin-workspace customer-app-content">
    <div class="management-page">
        <a class="btn btn-outline-secondary mb-3" th:href="@{/customer/portal}">Quay lại</a>
        <h1>Hồ sơ khách hàng</h1>
        <div th:if="${param.success != null}" class="alert alert-success">Cập nhật hồ sơ thành công.</div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Có lỗi xảy ra.</div>
        <form th:action="@{/customer/portal/profile/update}" method="post" class="row g-3 mt-2">
            <div class="col-md-6">
                <label class="form-label">Họ và tên</label>
                <input class="form-control" type="text" name="fullName" th:value="${customer.fullName}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Điện thoại</label>
                <input class="form-control" type="text" name="phone" th:value="${customer.phone}">
            </div>
            <div class="col-12">
                <label class="form-label">Địa chỉ</label>
                <textarea class="form-control" name="address" rows="3" th:text="${customer.address}"></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-success" type="submit">Lưu hồ sơ</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
