<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="customerLayout">
    <aside class="customer-sidebar">
        <a class="customer-sidebar-brand" th:href="@{/dashboard/customer}">
            <span class="customer-sidebar-brand-icon">
                <i class="fas fa-building"></i>
            </span>
            <span>
                <strong>CompanyMS</strong>
                <small>Cổng khách hàng</small>
            </span>
        </a>

        <nav class="customer-sidebar-nav" aria-label="Điều hướng khách hàng">
            <a th:href="@{/dashboard/customer}" data-customer-nav="/dashboard/customer">
                <i class="fas fa-chart-line"></i>
                <span>Tổng quan</span>
            </a>
            <a th:href="@{/customer/portal}" data-customer-nav="/customer/portal">
                <i class="fas fa-house"></i>
                <span>Trang chính</span>
            </a>
            <a th:href="@{/customer/portal/contracts}" data-customer-nav="/customer/portal/contracts">
                <i class="fas fa-file-contract"></i>
                <span>Hợp đồng</span>
            </a>
            <a th:href="@{/customer/portal/payments}" data-customer-nav="/customer/portal/payments">
                <i class="fas fa-credit-card"></i>
                <span>Thanh toán</span>
            </a>
            <a th:href="@{/customer/portal/profile}" data-customer-nav="/customer/portal/profile">
                <i class="fas fa-user-gear"></i>
                <span>Hồ sơ</span>
            </a>
        </nav>
    </aside>

    <header class="customer-topbar">
        <button class="customer-mobile-toggle" type="button" aria-label="Mở menu khách hàng">
            <i class="fas fa-bars"></i>
        </button>
        <div>
            <strong>Cổng khách hàng</strong>
            <span>Theo dõi báo giá, hợp đồng và thanh toán</span>
        </div>
        <div class="d-flex align-items-center ms-auto">
            <!-- Nút Chuông Thông Báo Khách Hàng -->
            <div class="dropdown me-3 position-relative" id="notiBellWrapper">
                <button class="position-relative border-0 bg-transparent p-2 text-dark"
                        type="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                        title="Thông báo" aria-label="Thông báo" style="font-size: 1.25rem;">
                    <i class="fas fa-bell"></i>
                    <span id="bell-badge-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 9px; padding: 4px 6px; transform: translate(-30%, -30%) !important;">
                        0
                    </span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end notification-dropdown p-2 shadow" aria-labelledby="bellDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                    <li>
                        <div class="notification-dropdown-header d-flex justify-content-between align-items-center pb-2 border-bottom mb-2">
                            <strong style="font-size: 14px;">Thông báo mới nhận</strong>
                            <span class="badge bg-primary text-white rounded-pill" id="quick-unread-txt" style="font-size: 11px;">0 chưa đọc</span>
                        </div>
                    </li>

                    <div id="bell-items-container">
                        <li><div class="notification-empty text-center text-muted py-3" style="font-size: 13px;">Đang tải thông báo...</div></li>
                    </div>

                    <li class="border-top mt-2 pt-2">
                        <a class="dropdown-item text-center text-primary fw-bold" th:href="@{/customer/portal/notifications}" style="font-size: 13px;">
                            Xem tất cả thông báo <i class="fas fa-arrow-right ms-1"></i>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="customer-account">
                <button class="customer-account-toggle" type="button" aria-expanded="false" aria-controls="customerAccountMenu">
                    <span class="customer-account-avatar">
                        <i class="fas fa-user"></i>
                    </span>
                    <span class="customer-account-name" th:text="${customer != null ? (customer.fullName != null ? customer.fullName : customer.email) : 'Khách hàng'}">Khách hàng</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
            <div class="customer-account-menu" id="customerAccountMenu" hidden>
                <div class="customer-account-menu-head">
                    <strong th:text="${customer != null ? (customer.fullName != null ? customer.fullName : 'Khách hàng') : 'Khách hàng'}">Khách hàng</strong>
                    <span th:text="${customer != null ? customer.email : 'customer@example.com'}">customer@example.com</span>
                </div>
                <a th:href="@{/customer/portal/profile}">
                    <i class="fas fa-user"></i>
                    Hồ sơ khách hàng
                </a>
                <a th:href="@{/customer/portal/contracts}">
                    <i class="fas fa-file-contract"></i>
                    Hợp đồng của tôi
                </a>
                <a class="danger" th:href="@{/customer/logout}">
                    <i class="fas fa-right-from-bracket"></i>
                    Đăng xuất
                </a>
            </div>
            </div>
        </div>
    </header>

    <div class="customer-sidebar-backdrop"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const path = window.location.pathname;
            const navItems = document.querySelectorAll('[data-customer-nav]');
            navItems.forEach(function (item) {
                const target = item.getAttribute('data-customer-nav');
                let active = target === '/customer/portal'
                    ? path === target
                    : path === target || path.startsWith(target + '/');
                if (target === '/customer/portal/payments' && path.startsWith('/invoices/detail/')) {
                    active = true;
                }
                item.classList.toggle('active', active);
            });

            const account = document.querySelector('.customer-account');
            const toggle = document.querySelector('.customer-account-toggle');
            const menu = document.querySelector('.customer-account-menu');
            if (account && toggle && menu) {
                toggle.addEventListener('click', function (event) {
                    event.stopPropagation();
                    const willOpen = menu.hidden;
                    menu.hidden = !willOpen;
                    toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                    account.classList.toggle('open', willOpen);
                });
                document.addEventListener('click', function (event) {
                    if (!account.contains(event.target)) {
                        menu.hidden = true;
                        toggle.setAttribute('aria-expanded', 'false');
                        account.classList.remove('open');
                    }
                });
            }

            const mobileToggle = document.querySelector('.customer-mobile-toggle');
            const sidebar = document.querySelector('.customer-sidebar');
            const backdrop = document.querySelector('.customer-sidebar-backdrop');
            function closeSidebar() {
                document.body.classList.remove('customer-sidebar-open');
            }
            if (mobileToggle && sidebar && backdrop) {
                mobileToggle.addEventListener('click', function () {
                    document.body.classList.toggle('customer-sidebar-open');
                });
                backdrop.addEventListener('click', closeSidebar);
                navItems.forEach(function (item) {
                    item.addEventListener('click', closeSidebar);
                });
            }

            // Tải thông báo cho khách hàng
            loadCustomerBellNotifications();
        });

        function loadCustomerBellNotifications() {
            fetch('/api/notifications/customer/summary')
                .then(response => response.json())
                .then(data => {
                    const badge = document.getElementById('bell-badge-count');
                    const txtUnread = document.getElementById('quick-unread-txt');
                    const container = document.getElementById('bell-items-container');

                    if (!badge || !txtUnread || !container) return;

                    if (data.unreadCount > 0) {
                        badge.textContent = data.unreadCount;
                        badge.classList.remove('d-none');
                        txtUnread.textContent = data.unreadCount + ' chưa đọc';
                    } else {
                        badge.classList.add('d-none');
                        txtUnread.textContent = '0 chưa đọc';
                    }

                    if (data.notifications && data.notifications.length > 0) {
                        let htmlOutput = '';
                        data.notifications.forEach(item => {
                            const unreadClass = !item.isRead ? 'fw-bold text-dark' : 'text-muted';
                            const dotIcon = !item.isRead ? '<i class="fas fa-circle text-primary me-2" style="font-size:8px;"></i>' : '<i class="far fa-circle text-secondary me-2" style="font-size:8px;"></i>';
                            const itemBg = !item.isRead ? 'background-color: #f8fafd;' : '';

                            htmlOutput += `
                                <li class="notification-item p-2 mb-1 rounded" style="${itemBg} cursor: pointer; list-style: none;" onclick="clickCustomerNotiInBell(${item.id})">
                                    <div class="${unreadClass} text-truncate" style="font-size: 13px;">${dotIcon}${item.title}</div>
                                    <div class="notification-message text-truncate text-muted" style="font-size: 11px; max-width: 100%;">${item.message}</div>
                                </li>`;
                        });
                        container.innerHTML = htmlOutput;
                    } else {
                        container.innerHTML = '<li><div class="notification-empty text-center text-muted py-3" style="font-size: 13px;"><i class="far fa-bell-slash me-1"></i>Không có thông báo mới</div></li>';
                    }
                })
                .catch(err => console.error('Lỗi tải thông báo từ API:', err));
        }

        function clickCustomerNotiInBell(notiId) {
            fetch('/api/notifications/' + notiId + '/read', { method: 'POST' })
                .then(() => {
                    window.location.href = '/customer/portal/notifications';
                })
                .catch(err => console.error('Lỗi xử lý đọc thông báo:', err));
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
