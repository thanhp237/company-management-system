<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Company Management System'">Hệ thống quản lý công ty</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/main.css}">
    
    <!-- Additional CSS from child templates -->
    <th:block th:insert="~{fragments/css}"></th:block>
</head>
<body>
    <!-- Navigation Bar -->
    <th:block th:insert="~{layouts/navbar}"></th:block>
    
    <!-- Sidebar (if user is logged in) -->
    <div sec:authorize="isAuthenticated()">
        <th:block th:insert="~{layouts/sidebar}"></th:block>
    </div>
    
    <!-- Main Content -->
    <main id="main-content" th:classappend="${isLoggedIn} ? 'with-sidebar'">
        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show m-3" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show m-3" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
        </div>
        
        <!-- Page Content -->
        <div th:insert="${content}"></div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-light border-top py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted mb-0">&copy; 2026 Company Management System. Bảo lưu mọi quyền.</p>
                </div>
                <div class="col-md-6 text-end">
                    <a href="#" class="text-muted text-decoration-none me-3">Quyền riêng tư</a>
                    <a href="#" class="text-muted text-decoration-none me-3">Điều khoản</a>
                    <a href="#" class="text-muted text-decoration-none">Hỗ trợ</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Bootstrap JS Bundle (includes Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    
    <!-- Additional JS from child templates -->
    <th:block th:insert="~{fragments/js}"></th:block>
</body>
</html>
