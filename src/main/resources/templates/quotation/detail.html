<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quotation Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Quotation Detail</h2>

        <div class="d-flex gap-2">
            <form th:if="${quotation.status != null and #strings.toUpperCase(quotation.status) == 'DRAFT'}"
                  th:action="@{/quotation/{id}/accept(id=${quotation.id})}"
                  method="post"
                  class="m-0"
                  onsubmit="return confirm('Chuyển báo giá này sang ACCEPTED?');">
                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-check"></i>
                    Chuyển sang ACCEPTED
                </button>
            </form>
            <a th:href="@{/quotation/export-pdf/{id}(id=${quotation.id})}"
               class="btn btn-danger">
                Export PDF
            </a>

            <a th:href="@{/pipeline}"
               class="btn btn-outline-secondary">
                Back
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card mb-4">
        <div class="card-header fw-bold">
            Quotation Information
        </div>

        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Quotation Code</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.quotationCode}"
                           readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.status}"
                           readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Created At</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.createdAt}"
                           readonly>
                </div>

            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header fw-bold">
            Customer Information
        </div>

        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Customer Name</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.customerName}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.customerPhone}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.customerEmail}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Address</label>
                    <input type="text"
                           class="form-control"
                           th:value="${quotation.customerAddress}"
                           readonly>
                </div>

            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header fw-bold">
            Quotation Items
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Product Code</th>
                        <th>Product Name</th>
                        <th>Description</th>
                        <th class="text-end">Quantity</th>
                        <th class="text-end">Unit Price</th>
                        <th class="text-end">Total Price</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${quotation.details}">
                        <td th:text="${item.productCode}"></td>
                        <td th:text="${item.productName}"></td>
                        <td th:text="${item.description}"></td>
                        <td class="text-end" th:text="${item.quantity}"></td>
                        <td class="text-end" th:text="${item.unitPrice}"></td>
                        <td class="text-end" th:text="${item.totalPrice}"></td>
                    </tr>

                    <tr th:if="${quotation.details == null || #lists.isEmpty(quotation.details)}">
                        <td colspan="6" class="text-center text-muted">
                            No products found
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="row justify-content-end mt-4">
                <div class="col-md-5">

                    <div class="d-flex justify-content-between border-bottom py-2">
                        <span>Sub Total</span>
                        <strong th:text="${quotation.subTotal}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2">
                        <span>Discount</span>
                        <strong th:text="${quotation.discountAmount}"></strong>
                    </div>

                    <div class="d-flex justify-content-between py-3 fs-5">
                        <span class="fw-bold">Final Amount</span>
                        <strong class="text-success"
                                th:text="${quotation.finalAmount}">
                        </strong>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header fw-bold">
            Note
        </div>

        <div class="card-body">
            <textarea class="form-control"
                      rows="4"
                      readonly
                      th:text="${quotation.note}">
            </textarea>
        </div>
    </div>

</div>

</body>
</html>
