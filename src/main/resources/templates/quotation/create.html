<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo báo giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2 class="mb-4">Tạo báo giá</h2>

    <form th:action="@{/quotation/save}" th:object="${quotationRequest}" method="post">
        <input type="hidden" th:field="*{customerId}">
        <input type="hidden" th:field="*{opportunityId}">

        <div class="card mb-4">
            <div class="card-header fw-bold">Thông tin khách hàng</div>
            <div class="card-body row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tên khách hàng</label>
                    <input class="form-control"
                           th:value="${customer.fullName != null ? customer.fullName : (customer.name != null ? customer.name : customer.companyName)}"
                           readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Điện thoại</label>
                    <input class="form-control" th:value="${customer.phone}" readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" th:value="${customer.email}" readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Địa chỉ</label>
                    <input class="form-control" th:value="${customer.address}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cơ hội</label>
                    <select class="form-select" name="opportunityPicker" disabled>
                        <option th:if="${quotationRequest.opportunityId == null}" value="">-- Không chọn cơ hội --</option>
                        <option th:each="o : ${opportunities}"
                                th:value="${o.id}"
                                th:selected="${quotationRequest.opportunityId != null and quotationRequest.opportunityId == o.id}"
                                th:text="${o.opportunityCode}">
                        </option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header fw-bold">Thông tin báo giá</div>
            <div class="card-body row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Mã báo giá</label>
                    <input class="form-control"
                           th:field="*{quotationCode}"
                           readonly>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Ngày báo giá</label>
                    <input type="date"
                           class="form-control"
                           th:value="${quotationDate}"
                           readonly>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Hiệu lực đến</label>
                    <input type="date" class="form-control" th:field="*{validUntil}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nhân viên kinh doanh</label>
                    <input class="form-control" th:value="${salesPerson}" readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Trạng thái</label>
                    <input class="form-control" value="Bản nháp" readonly>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header fw-bold">Sản phẩm</div>
            <div class="card-body">
                <table class="table table-bordered align-middle" id="productTable">
                    <thead class="table-light">
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Mô tả</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody id="productBody">
                    <tr>
                        <td>
                            <select class="form-select product-select" name="details[0].productId" required>
                                <option value="">-- Chọn sản phẩm --</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:text="${p.name}"
                                        th:attr="data-price=${p.unitPrice},data-description=${p.description}">
                                </option>
                            </select>
                        </td>

                        <td>
                            <input class="form-control description" readonly>
                        </td>

                        <td>
                            <input class="form-control unit-price" readonly>
                        </td>

                        <td>
                            <input type="number" class="form-control quantity"
                                   name="details[0].quantity" value="1" min="1" required>
                        </td>

                        <td>
                            <input class="form-control total-price" readonly>
                        </td>

                        <td>
                            <button type="button" class="btn btn-danger btn-sm remove-row">Xóa</button>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <button type="button" class="btn btn-primary" id="addProduct">
                    + Thêm sản phẩm
                </button>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header fw-bold">Voucher / tổng hợp</div>
            <div class="card-body row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Voucher</label>
                    <select class="form-select" th:field="*{voucherId}" id="voucherSelect">
                        <option value=""
                                data-percent="0"
                                data-max="0">
                            -- Không dùng voucher --
                        </option>

                        <option th:each="v : ${vouchers}"
                                th:value="${v.id}"
                                th:text="${v.voucherCode}"
                                th:attr="data-percent=${v.discountPercent},data-max=${v.maxDiscountAmount}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Tạm tính</label>
                    <input class="form-control fw-bold" id="subTotal" value="0" readonly>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Tiền giảm giá</label>
                    <input type="number" class="form-control" id="discountAmount"
                           th:field="*{discountAmount}" value="0" min="0">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Tổng thanh toán</label>
                    <input class="form-control fw-bold" id="finalAmount" value="0" readonly>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header fw-bold">Ghi chú</div>
            <div class="card-body">
                <textarea class="form-control" rows="4" th:field="*{note}"></textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/customers}" class="btn btn-secondary">Hủy</a>
            <button type="submit" class="btn btn-success">Lưu báo giá</button>
        </div>
    </form>
</div>

<script>
    const body = document.getElementById("productBody");
    const addBtn = document.getElementById("addProduct");
    const subTotalInput = document.getElementById("subTotal");
    const discountInput = document.getElementById("discountAmount");
    const finalAmountInput = document.getElementById("finalAmount");
    const voucherSelect = document.getElementById("voucherSelect");
    function reIndexRows() {
        body.querySelectorAll("tr").forEach((row, index) => {
            row.querySelector(".product-select").name = `details[${index}].productId`;
            row.querySelector(".quantity").name = `details[${index}].quantity`;
        });
    }

    function calculate() {
        let subTotal = 0;

        body.querySelectorAll("tr").forEach(row => {
            const option = row.querySelector(".product-select").selectedOptions[0];
            const price = Number(option?.dataset.price || 0);
            const description = option?.dataset.description || "";
            const quantity = Number(row.querySelector(".quantity").value || 0);
            const total = price * quantity;

            row.querySelector(".description").value = description;
            row.querySelector(".unit-price").value = price;
            row.querySelector(".total-price").value = total;

            subTotal += total;
        });

        const discount = calculateVoucherDiscount(subTotal);

        discountInput.value = discount;
        subTotalInput.value = subTotal;
        finalAmountInput.value = Math.max(subTotal - discount, 0);
    }
    function calculateVoucherDiscount(subTotal) {
        if (!voucherSelect) {
            return 0;
        }

        const selected = voucherSelect.selectedOptions[0];
        const percent = Number(selected?.dataset.percent || 0);
        const maxDiscount = Number(selected?.dataset.max || 0);

        let discount = subTotal * percent / 100;

        if (maxDiscount > 0) {
            discount = Math.min(discount, maxDiscount);
        }

        return discount;
    }

    addBtn.addEventListener("click", () => {
        const firstRow = body.querySelector("tr");
        const newRow = firstRow.cloneNode(true);

        newRow.querySelector(".product-select").value = "";
        newRow.querySelector(".description").value = "";
        newRow.querySelector(".unit-price").value = "";
        newRow.querySelector(".quantity").value = 1;
        newRow.querySelector(".total-price").value = "";

        body.appendChild(newRow);
        reIndexRows();
    });

    body.addEventListener("change", calculate);
    body.addEventListener("input", calculate);
    discountInput.addEventListener("input", calculate);
    if (voucherSelect) {
        voucherSelect.addEventListener("change", calculate);
    }
    body.addEventListener("click", e => {
        if (e.target.classList.contains("remove-row") && body.querySelectorAll("tr").length > 1) {
            e.target.closest("tr").remove();
            reIndexRows();
            calculate();
        }
    });
</script>

</body>
</html>
