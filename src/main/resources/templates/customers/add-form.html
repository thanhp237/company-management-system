<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Sửa khách hàng - CompanyMS' : 'Thêm khách hàng - CompanyMS'">Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>
<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar customer-workspace">
    <div class="management-page customer-page">
        <div class="management-taskbar customer-taskbar">
            <div>
                <p class="management-eyebrow">CRM / Khách hàng</p>
                <h1 th:text="${isEdit} ? 'Sửa khách hàng' : 'Thêm khách hàng mới'">Thêm khách hàng mới</h1>
                <p class="management-subtitle">Cập nhật thông tin liên hệ, nguồn khách hàng và trạng thái tài khoản.</p>
            </div>
            <div class="management-actions">
                <a class="btn management-secondary-action" th:href="@{/customers}">
                    <i class="fas fa-arrow-left"></i>
                    <span>Danh sách</span>
                </a>
            </div>
        </div>

        <div class="customer-tabs">
            <a th:href="@{/customer}">
                <i class="fas fa-file-import"></i>
                <span>Nhập dữ liệu & phân bổ</span>
            </a>
            <a class="active" th:href="@{/customers}">
                <i class="fas fa-table-list"></i>
                <span>Quản lý khách hàng</span>
            </a>
        </div>

        <div th:if="${errorMessage}" class="management-alert danger">
            <i class="fas fa-circle-exclamation"></i>
            <span th:text="${errorMessage}">Có lỗi xảy ra.</span>
        </div>

        <section class="customer-form-shell">
            <div class="customer-form-header">
                <div>
                    <h2 th:text="${isEdit} ? 'Thông tin khách hàng' : 'Tạo hồ sơ khách hàng'">Thông tin khách hàng</h2>
                    <p>Quản lý thủ công dùng cho khách hàng đã xác minh hoặc cần cập nhật nhanh.</p>
                </div>
            </div>

            <form class="customer-form" th:object="${customerForm}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="customer-form-grid">
                    <label>
                        <span>Họ tên</span>
                        <input type="text" th:field="*{fullName}" required>
                    </label>
                    <label>
                        <span>Số điện thoại</span>
                        <input type="text" th:field="*{phone}" required>
                    </label>
                    <label>
                        <span>Email</span>
                        <input type="email" th:field="*{email}">
                    </label>
                    <label>
                        <span>Nguồn khách hàng</span>
                        <input type="text" th:field="*{customerSource}">
                    </label>
                    <label>
                        <span>Mã nhân viên kinh doanh phụ trách</span>
                        <input type="number" th:field="*{assignedSalesId}">
                    </label>
                    <label th:if="${isEdit}">
                        <span>Trạng thái</span>
                        <select th:field="*{customerStatus}">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Ngừng hoạt động</option>
                        </select>
                    </label>
                    <label class="wide">
                        <span>Địa chỉ</span>
                        <textarea th:field="*{address}" rows="3"></textarea>
                    </label>
                </div>

                <div class="customer-form-actions">
                    <a class="customer-secondary-button" th:href="@{/customers}">
                        <i class="fas fa-xmark"></i>
                        <span>Hủy</span>
                    </a>
                    <button class="customer-primary-button"
                            type="submit"
                            th:formaction="${isEdit} ? @{/customers/update} : @{/customers/save}">
                        <i class="fas" th:classappend="${isEdit} ? ' fa-floppy-disk' : ' fa-plus'"></i>
                        <span th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo khách hàng'">Lưu</span>
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
