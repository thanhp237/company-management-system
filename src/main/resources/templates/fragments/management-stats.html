<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="userStats" class="management-stat-grid user-stat-grid">
    <article class="management-stat-card success user-stat-card">
        <span>Tổng tài khoản</span>
        <strong th:text="${countAccount != null ? countAccount : 0}">0</strong>
        <small>
            <i class="fas fa-layer-group"></i>
            Bản ghi phù hợp
        </small>
    </article>

    <article class="management-stat-card info user-stat-card">
        <span>Đang hoạt động</span>
        <strong th:text="${users != null ? users.?[status == 'ACTIVE'].size() : 0}">0</strong>
        <small>
            <i class="fas fa-check-circle"></i>
            Trong trang hiện tại
        </small>
    </article>

    <article class="management-stat-card danger user-stat-card">
        <span>Tạm khóa</span>
        <strong th:text="${users != null ? users.?[status == 'INACTIVE'].size() : 0}">0</strong>
        <small>
            <i class="fas fa-lock"></i>
            Cần kiểm tra
        </small>
    </article>
</div>

<div th:fragment="pipelineStats" class="management-stat-grid">
    <article class="management-stat-card success">
        <span>Total Opportunities</span>
        <strong th:text="${countAccount != null ? countAccount : 0}">0</strong>
        <small>
            <i class="fas fa-layer-group"></i>
            Matching records
        </small>
    </article>

    <article class="management-stat-card info">
        <span>Won Deals</span>
        <strong th:text="${stageCounts != null ? stageCounts.get('WON') : 0}">0</strong>
        <small>
            <i class="fas fa-trophy"></i>
            Closed successfully
        </small>
    </article>

    <article class="management-stat-card warning">
        <span>Lost Deals</span>
        <strong th:text="${stageCounts != null ? stageCounts.get('LOST') : 0}">0</strong>
        <small>
            <i class="fas fa-circle-exclamation"></i>
            Closed unsuccessfully
        </small>
    </article>
</div>

</body>
</html>
