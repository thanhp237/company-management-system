<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<form th:fragment="userFilters" class="management-filterbar user-filterbar" th:action="@{/users/find}" method="get">
    <label>
        <span>Tìm kiếm</span>
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Tên, email hoặc mã nhân viên...">
    </label>

    <label>
        <span>Vai trò</span>
        <select name="role">
            <option value="">Tất cả vai trò</option>
            <option th:each="roleItem : ${roles}"
                    th:value="${roleItem.roleCode}"
                    th:text="${roleItem.roleName}"
                    th:selected="${role == roleItem.roleCode}">Administrator</option>
        </select>
    </label>

    <label>
        <span>Trạng thái</span>
        <select name="status">
            <option value="">Tất cả trạng thái</option>
            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Đang hoạt động</option>
            <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Tạm khóa</option>
        </select>
    </label>

    <button class="filter-icon-button" type="submit" title="Lọc danh sách" aria-label="Lọc danh sách">
        <i class="fas fa-filter"></i>
    </button>

    <a class="filter-reset-button" th:href="@{/users}" title="Xóa lọc" aria-label="Xóa lọc">
        <i class="fas fa-xmark"></i>
        <span>Xóa lọc</span>
    </a>
</form>

<form th:fragment="pipelineFilters" class="management-filterbar" th:action="@{/pipeline/find}" method="get">
    <label class="filter-wide">
        <span>Lead / Customer</span>
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by code, customer, assigned to">
    </label>

    <label>
        <span>Stage</span>
        <select name="stage">
            <option value="" th:selected="${selectedStage == 'ALL'}">All Stages</option>
            <option th:each="stage : ${stages}"
                    th:value="${stage}"
                    th:text="${stage}"
                    th:selected="${selectedStage == stage}">NEW</option>
        </select>
    </label>

    <button class="filter-icon-button" type="submit" title="Apply filters" aria-label="Apply filters">
        <i class="fas fa-filter"></i>
    </button>
</form>

</body>
</html>
