<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="userTaskbar" class="management-taskbar user-taskbar">
    <div>
        <p class="management-eyebrow">Quản trị người dùng</p>
        <h1>Danh sách nhân viên</h1>
        <p class="management-subtitle">Quản lý tài khoản, vai trò và trạng thái truy cập trong hệ thống CRM.</p>
    </div>

    <div class="management-actions">
        <a class="btn btn-primary management-primary-action" th:href="@{/users/add}">
            <i class="fas fa-user-plus"></i>
            <span>Thêm nhân viên</span>
        </a>
    </div>
</div>

<div th:fragment="pipelineTaskbar" class="management-taskbar">
    <div>
        <p class="management-eyebrow">Vận hành doanh thu</p>
        <h1>Quy trình cơ hội bán hàng</h1>
        <p class="management-subtitle">Theo dõi cơ hội theo giai đoạn, người phụ trách và giá trị dự kiến.</p>
    </div>

    <div class="management-actions">
        <a class="btn btn-outline-secondary management-secondary-action" th:href="@{/dashboard}">
            <i class="fas fa-arrow-left"></i>
            <span>Bảng điều khiển</span>
        </a>
    </div>
</div>

</body>
</html>
