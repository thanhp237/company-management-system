<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu lần đầu - CompanyMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/features/auth.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="brand-mark">
            <span class="brand-icon"><i class="fa-solid fa-building"></i></span>
            <span>Company Management</span>
        </div>

        <h2>Đổi mật khẩu lần đầu</h2>
        <p class="subtitle">Để bảo mật tài khoản, vui lòng thay đổi mật khẩu mặc định của bạn trước khi tiếp tục sử dụng hệ thống.</p>

        <div class="alert" th:if="${error}">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}">Mật khẩu không hợp lệ.</span>
        </div>

        <form method="post" th:action="@{/first-change-password}" th:object="${changePassword}">
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-wrap">
                    <span class="form-icon"><i class="fa-solid fa-lock"></i></span>
                    <input id="newPassword" type="password" th:field="*{newPassword}" placeholder="Nhập mật khẩu mới" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <div class="input-wrap">
                    <span class="form-icon"><i class="fa-solid fa-shield-halved"></i></span>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Xác nhận mật khẩu mới" required>
                </div>
            </div>

            <button class="submit-btn" type="submit">
                <i class="fa-solid fa-key"></i>
                Đổi mật khẩu
            </button>
        </form>

        <p class="note">Mật khẩu mới nên có ít nhất 8 ký tự bao gồm chữ và số để tăng cường độ bảo mật.</p>
    </div>
</div>
</body>
</html>
