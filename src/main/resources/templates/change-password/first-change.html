<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu lần đầu - CompanyMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --green: #008a45;
            --green-dark: #006b35;
            --green-soft: #e8f7ef;
            --ink: #101923;
            --muted: #667789;
            --line: #dfe7e2;
            --panel: #ffffff;
            --page: #f4f8f6;
            --danger: #b42318;
            --danger-bg: #fef3f2;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
            background: var(--page);
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(460px, 100%);
            padding: 32px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 44px rgba(31, 45, 57, 0.08);
        }

        .brand-mark {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-weight: 900;
            color: var(--green);
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--green);
            color: #fff;
        }

        h2 {
            margin: 0;
            color: var(--ink);
            font-size: 26px;
            line-height: 1.2;
            font-weight: 900;
        }

        .subtitle {
            margin: 10px 0 22px;
            color: var(--muted);
            line-height: 1.65;
            font-size: 14px;
        }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.45;
            border: 1px solid #fecdca;
            background: var(--danger-bg);
            color: var(--danger);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #405366;
            font-size: 13px;
            font-weight: 900;
        }

        .input-wrap {
            position: relative;
        }

        .form-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            width: 20px;
            height: 20px;
            color: #8a99a8;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px 0 44px;
            border: 1.5px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(0, 138, 69, 0.1);
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 8px;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(0, 138, 69, 0.2);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--green-dark);
        }

        .note {
            margin: 22px 0 0;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="brand-mark">
            <span class="brand-icon"><i class="fa-solid fa-building"></i></span>
            <span>Company Management</span>
        </div>

        <h2>Đổi mật khẩu lần đầu</h2>
        <p class="subtitle">Để bảo mật tài khoản, vui lòng thay đổi mật khẩu mặc định của bạn trước khi tiếp tục sử dụng hệ thống.</p>

        <div class="alert" th:if="${error}">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}">Mật khẩu không hợp lệ.</span>
        </div>

        <form method="post" th:action="@{/first-change-password}" th:object="${changePassword}">
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-wrap">
                    <span class="form-icon"><i class="fa-solid fa-lock"></i></span>
                    <input id="newPassword" type="password" th:field="*{newPassword}" placeholder="Nhập mật khẩu mới" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <div class="input-wrap">
                    <span class="form-icon"><i class="fa-solid fa-shield-halved"></i></span>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Xác nhận mật khẩu mới" required>
                </div>
            </div>

            <button class="submit-btn" type="submit">
                <i class="fa-solid fa-key"></i>
                Đổi mật khẩu
            </button>
        </form>

        <p class="note">Mật khẩu mới nên có ít nhất 8 ký tự bao gồm chữ và số để tăng cường độ bảo mật.</p>
    </div>
</div>
</body>
</html>
