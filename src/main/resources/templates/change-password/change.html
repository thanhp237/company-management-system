<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f4f8f6;
        }
        .change-password-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #dfe7e2;
            box-shadow: 0 18px 44px rgba(31, 45, 57, 0.08);
        }
        .form-label {
            font-weight: 700;
            color: #405366;
            font-size: 13px;
        }
        .submit-btn {
            background: #008a45;
            color: #fff;
            font-weight: 900;
            border: 0;
            height: 44px;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background: #006b35;
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>

<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar user-workspace">
    <div class="container-fluid py-4">
        <div class="change-password-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 mb-0 fw-bold"><i class="fas fa-key me-2 text-success"></i>Đổi mật khẩu</h2>
                <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">Quay lại</a>
            </div>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Mật khẩu cũ không chính xác.</span>
            </div>

            <form th:action="@{/change-password}" th:object="${changePassword}" method="post">
                <div class="mb-3">
                    <label class="form-label">Mật khẩu hiện tại</label>
                    <input type="password" class="form-control" th:field="*{currentPassword}" required placeholder="Nhập mật khẩu hiện tại">
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" class="form-control" th:field="*{newPassword}" required placeholder="Nhập mật khẩu mới">
                </div>

                <div class="mb-4">
                    <label class="form-label">Xác nhận mật khẩu mới</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" required placeholder="Xác nhận mật khẩu mới">
                </div>

                <button type="submit" class="submit-btn">Lưu mật khẩu mới</button>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
