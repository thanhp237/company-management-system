<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy trình cơ hội bán hàng - Company Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>
<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar">
    <div class="management-page">
        <th:block th:replace="~{fragments/admin-taskbars :: pipelineTaskbar}"></th:block>

        <div th:if="${successMessage}" class="management-alert success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}">Đã cập nhật quy trình bán hàng.</span>
        </div>
        <div th:if="${errorMessage}" class="management-alert danger">
            <i class="fas fa-circle-exclamation"></i>
            <span th:text="${errorMessage}">Có lỗi trong quy trình bán hàng.</span>
        </div>

        <th:block th:replace="~{fragments/management-filters :: pipelineFilters}"></th:block>

        <section class="pipeline-stage-strip" aria-label="Tổng hợp giai đoạn">
            <a th:each="stage : ${stages}"
               th:href="@{/pipeline/find(stage=${stage})}"
               th:classappend="${selectedStage == stage} ? 'active'">
                <span th:text="${stage == 'NEW' ? 'Mới' : (stage == 'QUALIFIED' ? 'Đã đủ điều kiện' : (stage == 'PROPOSAL' ? 'Đề xuất' : (stage == 'NEGOTIATION' ? 'Đàm phán' : (stage == 'WON' ? 'Thắng' : (stage == 'LOST' ? 'Thua' : stage)))))}">Mới</span>
                <strong th:text="${stageCounts.get(stage)}">0</strong>
            </a>
        </section>

        <section class="management-table-shell">
            <div class="table-responsive">
                <table class="management-table">
                    <thead>
                    <tr>
                        <th>Cơ hội</th>
                        <th>Khách hàng</th>
                        <th>Người phụ trách</th>
                        <th>Giai đoạn</th>
                        <th>Giá trị dự kiến</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="opportunity : ${opportunities}">
                        <td>
                            <div class="identity-cell">
                                <div class="avatar-circle sales">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <div>
                                    <strong th:text="${opportunity.opportunityCode}">OPP001</strong>
                                    <span th:text="${opportunity.updatedAt != null ? #temporals.format(opportunity.updatedAt, 'dd/MM/yyyy') : 'Chưa có ngày cập nhật'}">Cập nhật</span>
                                </div>
                            </div>
                        </td>
                        <td th:text="${opportunity.customer != null ? opportunity.customer.fullName : 'Chưa có'}">Khách hàng</td>
                        <td th:text="${opportunity.assignedTo != null ? opportunity.assignedTo.fullName : 'Chưa có'}">Nhân viên kinh doanh</td>
                        <td>
                            <span class="stage-pill"
                                  th:classappend="${#strings.toLowerCase(opportunity.stage)}"
                                  th:text="${opportunity.stage == 'NEW' ? 'Mới' : (opportunity.stage == 'QUALIFIED' ? 'Đã đủ điều kiện' : (opportunity.stage == 'PROPOSAL' ? 'Đề xuất' : (opportunity.stage == 'NEGOTIATION' ? 'Đàm phán' : (opportunity.stage == 'WON' ? 'Thắng' : (opportunity.stage == 'LOST' ? 'Thua' : opportunity.stage)))))}">Mới</span>
                        </td>
                        <td>
                            <strong th:text="${opportunity.expectedAmount != null ? #numbers.formatDecimal(opportunity.expectedAmount, 0, 'COMMA', 0, 'POINT') : '0'}">0</strong>
                        </td>
                        <td>
                            <div class="row-actions">
                                <a th:href="@{/pipeline/{id}(id=${opportunity.id})}" title="Xem chi tiết" aria-label="Xem chi tiết">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(opportunities)}">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-magnifying-glass-chart"></i>
                                <span>Không tìm thấy cơ hội nào.</span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="management-pagination" th:if="${opportunityPage != null and opportunityPage.totalPages > 0}">
                <span th:text="${'Đang hiển thị ' + #lists.size(opportunities) + ' / ' + opportunityPage.totalElements + ' cơ hội'}">Đang hiển thị cơ hội</span>
                <div class="pagination-buttons">
                    <a th:if="${!opportunityPage.hasPrevious()}" class="disabled" href="#">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <a th:if="${opportunityPage.hasPrevious() and isSearch == true}"
                       th:href="@{/pipeline/find(page=${opportunityPage.number - 1}, keyword=${keyword}, stage=${selectedStage == 'ALL' ? null : selectedStage})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <a th:if="${opportunityPage.hasPrevious() and isSearch != true}"
                       th:href="@{/pipeline(page=${opportunityPage.number - 1})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <th:block th:with="start=${opportunityPage.number - 2 < 0 ? 0 : opportunityPage.number - 2}, end=${opportunityPage.number + 2 > opportunityPage.totalPages - 1 ? opportunityPage.totalPages - 1 : opportunityPage.number + 2}">
                        <a th:each="pageIndex : ${#numbers.sequence(start, end)}"
                           th:text="${pageIndex + 1}"
                           th:classappend="${pageIndex == opportunityPage.number} ? 'active'"
                           th:href="${isSearch == true} ? @{/pipeline/find(page=${pageIndex}, keyword=${keyword}, stage=${selectedStage == 'ALL' ? null : selectedStage})} : @{/pipeline(page=${pageIndex})}">1</a>
                    </th:block>
                    <a th:if="${!opportunityPage.hasNext()}" class="disabled" href="#">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <a th:if="${opportunityPage.hasNext() and isSearch == true}"
                       th:href="@{/pipeline/find(page=${opportunityPage.number + 1}, keyword=${keyword}, stage=${selectedStage == 'ALL' ? null : selectedStage})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <a th:if="${opportunityPage.hasNext() and isSearch != true}"
                       th:href="@{/pipeline(page=${opportunityPage.number + 1})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </div>
            </div>
        </section>

        <th:block th:replace="~{fragments/management-stats :: pipelineStats}"></th:block>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
