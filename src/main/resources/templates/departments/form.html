<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu phòng ban - Company Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <link rel="stylesheet" th:href="@{/css/department.css}">
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>

<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar user-workspace">
    <div class="management-page user-form-page">

        <div class="management-taskbar user-taskbar">
            <div>
                <div class="management-eyebrow">QUẢN TRỊ PHÒNG BAN</div>
                <h1 th:text="${department.id == null ? 'Thêm phòng ban' : 'Cập nhật phòng ban'}">
                    Thêm phòng ban
                </h1>
                <p class="management-subtitle">
                    Quản lý mã phòng ban, tên phòng ban và người phụ trách.
                </p>
            </div>
        </div>

        <div class="alert alert-danger user-form-alert"
             th:if="${err}"
             th:text="${err}">
        </div>

        <form th:action="@{/departments/save}"
              th:object="${department}"
              method="post"
              sec:authorize="hasAnyRole('ADMIN','ADMIN_OFFICER')">

            <div class="user-form-shell">
                <section class="user-form-card department-form-card">
                    <div class="user-form-card-header">
                        <div class="user-form-card-icon">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <div>
                            <h2>Thông tin phòng ban</h2>
                            <p>Nhập thông tin cơ bản và người phụ trách phòng ban.</p>
                        </div>
                    </div>

                    <input type="hidden" th:field="*{id}">

                    <div class="user-form-grid">
                        <label class="user-field">
                            <span>Mã phòng ban <strong>*</strong></span>
                            <input type="text"
                                   th:field="*{code}"
                                   placeholder="VD: SALES"
                                   required>
                        </label>

                        <label class="user-field">
                            <span>Tên phòng ban <strong>*</strong></span>
                            <input type="text"
                                   th:field="*{name}"
                                   placeholder="VD: Phòng kinh doanh"
                                   required>
                        </label>

                        <label class="user-field">
                            <span>Người quản lý</span>
                            <select th:field="*{managerId}">
                                <option value="">-- Chọn quản lý --</option>
                                <option th:each="manager : ${managers}"
                                        th:value="${manager.id}"
                                        th:text="${manager.fullName + ' - ' + manager.role.roleCode}">
                                </option>
                            </select>
                        </label>
                        <label class="user-field">
                            <span>Số người tối đa</span>
                            <input type="number"
                                   th:field="*{maxMembers}"
                                   th:attr="min=${currentMembers > 0 ? currentMembers : 1}"
                                   placeholder="VD: 10">
                            <small th:if="${department.id != null}"
                                   th:text="${'Hiện có ' + currentMembers + ' nhân viên trong phòng ban'}">
                                Hiện có 0 nhân viên trong phòng ban
                            </small>
                        </label>
                        <label class="user-field" style="grid-column: 1 / -1;"
                               th:if="${department.id == null}">
                            <span>Chọn nhân viên</span>
                            <select name="userIds" multiple size="6">
                                <option th:each="u : ${assignableUsers}"
                                        th:value="${u.id}"
                                        th:text="${(u.fullName != null and !#strings.isEmpty(u.fullName) ? u.fullName : u.username) + ' - ' + u.role.roleCode}">
                                </option>
                            </select>
                            <small class="text-muted">Giữ Ctrl để chọn nhiều nhân viên</small>
                        </label>




                        <label class="user-field">
                            <span>Trạng thái mặc định</span>
                            <input type="text" value="Hoạt động" disabled>
                        </label>

                        <label class="user-field" style="grid-column: 1 / -1;">
                            <span>Mô tả</span>
                            <textarea class="department-form-textarea"
                                      th:field="*{description}"
                                      placeholder="Mô tả nhiệm vụ hoặc phạm vi phụ trách của phòng ban"></textarea>
                        </label>
                        <span th:if="${department.maxMembers != null and currentMembers >= department.maxMembers}"
                              class="badge bg-danger">
    ĐÃ ĐẦY
</span>

                    </div>
                </section>

                <aside class="user-form-side">
                    <section class="user-form-side-card">
                        <div class="user-form-status"
                             th:classappend="${department.id == null ? ' create' : ' edit'}">
                            <i class="fa-solid"
                               th:classappend="${department.id == null ? ' fa-plus' : ' fa-pen'}"></i>
                            <span th:text="${department.id == null ? 'Tạo mới' : 'Cập nhật'}">
                                Tạo mới
                            </span>
                        </div>

                        <h2>Thao tác</h2>
                        <p>Phòng ban mới sẽ tự động ở trạng thái hoạt động.</p>

                        <div class="user-form-actions">
                            <button type="submit" class="btn btn-success user-submit-primary">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Lưu phòng ban
                            </button>

                            <a class="btn user-submit-secondary" th:href="@{/departments}">
                                Quay lại
                            </a>
                        </div>
                    </section>
                </aside>
            </div>

        </form>
        <div class="user-form-shell"
             th:if="${department.id != null}"
             sec:authorize="hasAnyRole('ADMIN','ADMIN_OFFICER')">

            <aside class="user-form-side">
                <section class="user-form-side-card">
                    <h2>Gán nhân viên vào phòng ban</h2>

                    <form th:action="@{/departments/assign-user}" method="post">
                        <label class="user-field" style="grid-column: 1 / -1;">
                            <span>Chọn nhân viên</span>
                            <select name="userIds" multiple size="6">
                                <option th:each="u : ${assignableUsers}"
                                        th:value="${u.id}"
                                        th:text="${(u.fullName != null and !#strings.isEmpty(u.fullName) ? u.fullName : u.username) + ' - ' + u.role.roleCode}">
                                </option>
                            </select>
                        </label>

                        <input type="hidden" name="departmentId" th:value="${department.id}">

                        <button type="submit"
                                class="btn btn-primary"
                                th:disabled="${department.maxMembers != null and currentMembers >= department.maxMembers}">
                            Gán vào phòng ban
                        </button>
                    </form>
                </section>
            </aside>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
