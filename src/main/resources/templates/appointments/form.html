<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lên lịch hẹn - Company Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
    <link rel="stylesheet" th:href="@{/css/roles/admin/user.css}">
    <style>
        /* Đồng bộ hóa giao diện thẻ form theo đúng form nội bộ hệ thống */
        .app-form-container {
            max-width: 680px;
            margin: 0 auto;
        }
        .app-form-label {
            font-weight: 500;
            color: #334155;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .app-form-control {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .app-form-control:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 1px #3182ce;
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>
<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar user-workspace">
    <div class="management-page user-management-page">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark m-0" style="font-size: 1.5rem;">
                    <i class="far fa-calendar-plus text-success me-2"></i>Lên lịch hẹn
                </h2>
                <span class="text-muted small">Tạo lịch làm việc và đồng bộ hóa thông báo nhắc nhở tự động.</span>
            </div>
            <a th:href="@{/appointments}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <i class="fas fa-arrow-left me-1"></i> Trở lại danh sách
            </a>
        </div>

        <section class="management-table-shell user-table-shell p-4">
            <div class="app-form-container">
                <form th:action="@{/appointments/save}" th:object="${appointmentRequest}" method="post">
                    <div class="row g-3">
                        
                        <div class="col-md-12">
                            <label class="app-form-label">Chọn khách hàng <span class="text-danger">*</span></label>
                            <select th:field="*{customerId}" class="form-select app-form-control" required>
                                <option value="" selected disabled>-- Chọn khách hàng từ CRM --</option>
                                <option th:each="cust : ${customers}" th:value="${cust.id}" th:text="${cust.fullName}"></option>
                            </select>
                        </div>

                        <div class="col-md-12">
                            <label class="app-form-label">Tiêu đề lịch hẹn <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}" class="form-control app-form-control" placeholder="VD: Đàm phán hợp đồng, gọi tư vấn..." required>
                        </div>

                        <div class="col-md-12">
                            <label class="app-form-label">Ngày giờ hẹn <span class="text-danger">*</span></label>
                            <input type="datetime-local" th:field="*{appointmentTime}" class="form-control app-form-control" required>
                            <div class="form-text text-muted mt-1" style="font-size: 12px;">
                                <i class="fas fa-info-circle me-1 text-primary"></i> Hệ thống sẽ tự động bật cảnh báo nhắc nhở nội bộ trước giờ hẹn 1 ngày (24h).
                            </div>
                        </div>

                        <div class="col-md-12">
                            <label class="app-form-label">Mô tả / ghi chú</label>
                            <textarea th:field="*{description}" class="form-control app-form-control" rows="4" placeholder="Nhập mục tiêu cuộc gặp, địa điểm hoặc tài liệu nhân viên kinh doanh cần chuẩn bị trước..."></textarea>
                        </div>

                        <div class="col-12 mt-4 pt-2 border-top d-flex justify-content-end gap-2">
                            <button type="reset" class="btn btn-sm btn-light rounded-pill px-3 border">Xóa nội dung</button>
                            <button type="submit" class="btn btn-sm btn-success rounded-pill px-4 shadow-sm fw-medium">
                                <i class="fas fa-save me-1"></i> Lưu lịch hẹn
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
