<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Customer Activity - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>
<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar customer-workspace">
    <div class="management-page customer-page">
        <div class="management-taskbar customer-taskbar">
            <div>
                <p class="management-eyebrow">CRM / Customer Activity</p>
                <h1>Thêm activity</h1>
                <p class="management-subtitle">
                    <span th:text="${customer != null ? customer.fullName : 'Khách hàng'}">Khách hàng</span>
                    <span> • Ghi nhận call, meeting, email hoặc note</span>
                </p>
            </div>
            <div class="management-actions">
                <a class="customer-secondary-button" th:href="${returnUrl}">
                    <i class="fas fa-arrow-left"></i>
                    <span>Quay lại</span>
                </a>
            </div>
        </div>

        <div th:if="${errorMessage}" class="management-alert danger">
            <i class="fas fa-circle-exclamation"></i>
            <span th:text="${errorMessage}">Không thể lưu activity.</span>
        </div>

        <section class="customer-form-shell">
            <div class="customer-form-header">
                <div>
                    <h2>Thông tin activity</h2>
                    <p>Nội dung này sẽ được lưu vào lịch sử tương tác của khách hàng.</p>
                </div>
            </div>
            <form class="customer-form"
                  method="post"
                  th:action="@{/customer-activities/save}"
                  th:object="${activity}">
                <input type="hidden" th:field="*{customerId}">
                <input type="hidden" th:field="*{relatedType}">
                <input type="hidden" th:field="*{relatedId}">
                <input type="hidden" name="returnUrl" th:value="${returnUrl}">

                <div class="customer-form-grid">
                    <label>
                        <span>Loại activity <strong>*</strong></span>
                        <select th:field="*{activityType}" required>
                            <option value="">Chọn loại activity</option>
                            <option value="CALL">CALL</option>
                            <option value="MEETING">MEETING</option>
                            <option value="EMAIL">EMAIL</option>
                            <option value="NOTE">NOTE</option>
                        </select>
                    </label>

                    <label>
                        <span>Nhân viên phụ trách</span>
                        <input type="hidden" th:field="*{employeeId}">
                        <input type="text"
                               th:value="${currentEmployeeName}"
                               readonly>
                    </label>

                    <label class="wide">
                        <span>Ghi chú</span>
                        <textarea th:field="*{activityNote}"
                                  rows="5"
                                  placeholder="VD: Đã gọi trao đổi nhu cầu, hẹn demo vào thứ Sáu..."></textarea>
                    </label>
                </div>

                <div class="customer-form-actions">
                    <a class="customer-secondary-button" th:href="${returnUrl}">
                        <i class="fas fa-xmark"></i>
                        <span>Hủy</span>
                    </a>
                    <button class="customer-primary-button" type="submit">
                        <i class="fas fa-check"></i>
                        <span>Lưu activity</span>
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
