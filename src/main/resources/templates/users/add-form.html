<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit User' : 'Add User'">Add User</title>
</head>
<body>

<h2 th:text="${isEdit} ? 'Edit User' : 'Add New User'">Add New User</h2>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/users/save}" th:object="${userForm}" method="post">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{departmentId}">
    <input type="hidden" th:field="*{groupId}">
    <table>
        <tr>
            <td><label>Username:</label></td>
            <td><input type="text" th:field="*{username}" required></td>
        </tr>
        <tr th:if="${!isEdit}">
            <td><label>Password:</label></td>
            <td><input type="password" th:field="*{password}" required></td>
        </tr>
        <tr>
            <td><label>Email:</label></td>
            <td><input type="email" th:field="*{email}" required></td>
        </tr>
        <tr>
            <td><label>Full name:</label></td>
            <td><input type="text" th:field="*{fullName}"></td>
        </tr>
        <tr>
            <td><label>Phone:</label></td>
            <td><input type="text" th:field="*{phone}"></td>
        </tr>
        <tr>
            <td><label>Role:</label></td>
            <td>
                <select th:field="*{roleId}" required>
                    <option value="">-- Select Role --</option>
                    <option th:each="role : ${roles}"
                            th:value="${role.id}"
                            th:text="${role.roleName}"></option>
                </select>
            </td>
        </tr>
    </table>

    <br>
    <div>
        <a th:href="@{/users}">Back to List</a>
        <button type="submit" name="action" value="create" th:formaction="@{/users/save}" th:disabled="${isEdit}">
            Create User
        </button>
        <button type="submit" name="action" value="createAndSend" th:formaction="@{/users/save}" th:disabled="${isEdit}">
            Create & Send Email
        </button>
        <button type="submit" th:formaction="@{/users/update}" th:disabled="${!isEdit}">Edit User</button>
    </div>
</form>

</body>
</html>
