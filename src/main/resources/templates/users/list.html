<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Company Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>
<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar">
    <div class="management-page">
        <th:block th:replace="~{fragments/admin-taskbars :: userTaskbar}"></th:block>
        <th:block th:replace="~{fragments/management-filters :: userFilters}"></th:block>

        <section class="management-table-shell">
            <div class="table-responsive">
                <table class="management-table">
                    <thead>
                    <tr>
                        <th>User / Identity</th>
                        <th>Employee Code</th>
                        <th>Phone</th>
                        <th>System Role</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div class="identity-cell">
                                <div class="avatar-circle" th:text="${#strings.substring((user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : user.username), 0, 1)}">U</div>
                                <div>
                                    <strong th:text="${user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : user.username}">User Name</strong>
                                    <span th:text="${user.email}">user@enterprise.com</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="muted-code" th:text="${user.employeeCode != null ? user.employeeCode : 'N/A'}">EMP001</span>
                        </td>
                        <td th:text="${user.phone != null and !#strings.isEmpty(user.phone) ? user.phone : 'N/A'}">N/A</td>
                        <td>
                            <span class="role-pill" th:text="${user.roleName != null ? user.roleName : 'Unassigned'}">System Admin</span>
                        </td>
                        <td>
                            <form th:action="@{/users/update-status}" method="post" class="status-form">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <select name="status"
                                        class="status-select"
                                        th:classappend="${user.status == 'ACTIVE'} ? ' active' : ' inactive'"
                                        th:attr="data-current=${user.status}"
                                        onchange="if (confirm('Want to change status?')) { this.form.submit(); } else { this.value = this.dataset.current; }">
                                    <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">ACTIVE</option>
                                    <option value="INACTIVE" th:selected="${user.status == 'INACTIVE'}">INACTIVE</option>
                                </select>
                            </form>
                        </td>
                        <td>
                            <div class="row-actions">
                                <a th:href="@{/users/add(id=${user.id})}" title="Edit user" aria-label="Edit user">
                                    <i class="fas fa-pen"></i>
                                </a>
                                <a th:href="@{/users/delete/{id}(id=${user.id})}"
                                   class="danger"
                                   title="Delete user"
                                   aria-label="Delete user"
                                   onclick="return confirm('Delete this account?')">
                                    <i class="fas fa-trash-can"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-users-slash"></i>
                                <span>No accounts found.</span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="management-pagination" th:if="${userPage != null and userPage.totalPages > 0}">
                <span th:text="${'Showing ' + #lists.size(users) + ' of ' + userPage.totalElements + ' users'}">Showing users</span>
                <div class="pagination-buttons">
                    <a th:if="${!userPage.hasPrevious()}" class="disabled" href="#">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <a th:if="${userPage.hasPrevious() and isSearch == true}"
                       th:href="@{/users/find(page=${userPage.number - 1}, keyword=${keyword}, status=${status}, role=${role})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <a th:if="${userPage.hasPrevious() and isSearch != true}"
                       th:href="@{/users(page=${userPage.number - 1}, role=${role})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <th:block th:with="start=${userPage.number - 2 < 0 ? 0 : userPage.number - 2}, end=${userPage.number + 2 > userPage.totalPages - 1 ? userPage.totalPages - 1 : userPage.number + 2}">
                        <a th:each="pageIndex : ${#numbers.sequence(start, end)}"
                           th:text="${pageIndex + 1}"
                           th:classappend="${pageIndex == userPage.number} ? 'active'"
                           th:href="${isSearch == true} ? @{/users/find(page=${pageIndex}, keyword=${keyword}, status=${status}, role=${role})} : @{/users(page=${pageIndex}, role=${role})}">1</a>
                    </th:block>
                    <a th:if="${!userPage.hasNext()}" class="disabled" href="#">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <a th:if="${userPage.hasNext() and isSearch == true}"
                       th:href="@{/users/find(page=${userPage.number + 1}, keyword=${keyword}, status=${status}, role=${role})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <a th:if="${userPage.hasNext() and isSearch != true}"
                       th:href="@{/users(page=${userPage.number + 1}, role=${role})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </div>
            </div>
        </section>

        <th:block th:replace="~{fragments/management-stats :: userStats}"></th:block>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
