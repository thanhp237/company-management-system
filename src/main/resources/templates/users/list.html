<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User List - System Accounts</title>
</head>
<body>

<h2>Account Management</h2>
<a th:href="@{/users/add}">Add New Account</a>
<form th:action="@{/users/find}" method="get">
    <input
            type="text"
            name="keyword"
            th:value="${keyword}"
            placeholder="Search by username, email, full name..."
    >
    <select name="status">
        <option value="">All Status</option>
        <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
        <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive</option>
    </select>
    <select name="role">
        <option value="">All Roles</option>
        <option th:each="roleItem : ${roles}"
                th:value="${roleItem.roleCode}"
                th:text="${roleItem.roleName}"
                th:selected="${role == roleItem.roleCode}"></option>
    </select>
    <button type="submit">Search</button>
</form>

<p th:if="${countAccount != null}">
    Found: <strong th:text="${countAccount}"></strong> accounts
</p>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>STT</th>
        <th>Employee Code</th>
        <th>Username</th>
        <th>Email</th>
        <th>Full Name</th>
        <th>Phone</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user,stat : ${users}">
        <td th:text="${userPage != null ? userPage.number * userPage.size + stat.count : stat.count}"></td>
        <td th:text="${user.employeeCode != null ? user.employeeCode : 'N/A'}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.fullName}"></td>
        <td th:text="${user.phone}"></td>
        <td th:text="${user.roleName}"></td>

        <td>
            <form th:action="@{/users/update-status}" method="post" style="margin: 0;">
                <input type="hidden" name="id" th:value="${user.id}">

                <select name="status"
                        th:attr="data-current=${user.status}"
                        onchange="if (confirm('Want to change status?')) { this.form.submit(); } else { this.value = this.dataset.current; }">
                    <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">ACTIVE</option>
                    <option value="INACTIVE" th:selected="${user.status == 'INACTIVE'}">INACTIVE</option>
                </select>
            </form>
        </td>

        <td>
            <a th:href="@{/users/add(id=${user.id})}">Edit</a>
            |
            <a th:href="@{/users/delete/{id}(id=${user.id})}"
               onclick="return confirm('Delete this account?')">
                Delete
            </a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(users)}">
        <td colspan="9">No accounts found.</td>
    </tr>
    </tbody>
</table>


<div class="pagination" th:if="${userPage != null and userPage.totalPages > 0}">
    <a th:if="${userPage.hasPrevious() and isSearch != true}"
       th:href="@{/users(page=${userPage.number - 1}, role=${role})}">&laquo; Back</a>
    <a th:if="${userPage.hasPrevious() and isSearch == true}"
       th:href="@{/users/find(page=${userPage.number - 1}, keyword=${keyword}, status=${status}, role=${role})}">&laquo; Back</a>

    <span>
        Trang <strong th:text="${userPage.number + 1}">1</strong> /
        <span th:text="${userPage.totalPages}">1</span>
    </span>

    <a th:if="${userPage.hasNext() and isSearch != true}"
       th:href="@{/users(page=${userPage.number + 1}, role=${role})}">Next &raquo;</a>
    <a th:if="${userPage.hasNext() and isSearch == true}"
       th:href="@{/users/find(page=${userPage.number + 1}, keyword=${keyword}, status=${status}, role=${role})}">Next &raquo;</a>
</div>
<a th:href="@{/users}">Back to List</a>

</body>
</html>
