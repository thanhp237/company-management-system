<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập khách hàng - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
    <link rel="stylesheet" th:href="@{/css/features/auth.css}">
</head>
<body>
<main class="customer-login-shell">
    <section class="customer-login-card">
        <h1>Cổng khách hàng</h1>
        <p>Đăng nhập bằng email và mật khẩu được cấp từ hợp đồng.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Email hoặc mật khẩu không đúng.</div>
        <div th:if="${logout}" class="alert alert-success">Bạn đã đăng xuất thành công.</div>

        <form th:action="@{/customer/login}" method="post">
            <div class="mb-3">
                <label for="email">Email</label>
                <input id="email" class="form-control" type="email" name="email" required>
            </div>
            <div class="mb-4">
                <label for="password">Mật khẩu</label>
                <input id="password" class="form-control" type="password" name="password" required>
            </div>
            <button type="submit">
                <i class="fas fa-right-to-bracket me-2"></i>
                Đăng nhập
            </button>
        </form>
    </section>
</main>
</body>
</html>
