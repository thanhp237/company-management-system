<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/main.css}">
    <style>
        body {
            min-height: 100vh;
            background: #f5f8fb;
        }

        .customer-login-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .customer-login-card {
            width: min(430px, 100%);
            padding: 28px;
            border: 1px solid #dfe7e2;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 42px rgba(31, 45, 57, 0.08);
        }

        .customer-login-card h1 {
            margin: 0;
            color: #101923;
            font-size: 28px;
            font-weight: 900;
        }

        .customer-login-card p {
            margin: 8px 0 22px;
            color: #657386;
        }

        .customer-login-card label {
            margin-bottom: 8px;
            color: #405366;
            font-size: 13px;
            font-weight: 800;
        }

        .customer-login-card .form-control {
            height: 46px;
            border-radius: 8px;
        }

        .customer-login-card button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 8px;
            background: #007a3d;
            color: #fff;
            font-weight: 900;
        }
    </style>
</head>
<body>
<main class="customer-login-shell">
    <section class="customer-login-card">
        <h1>Customer Portal</h1>
        <p>Đăng nhập bằng email và mật khẩu được cấp từ hợp đồng.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Invalid email or password</div>
        <div th:if="${logout}" class="alert alert-success">Bạn đã đăng xuất thành công.</div>

        <form th:action="@{/customer/login}" method="post">
            <div class="mb-3">
                <label for="email">Email</label>
                <input id="email" class="form-control" type="email" name="email" required>
            </div>
            <div class="mb-4">
                <label for="password">Mật khẩu</label>
                <input id="password" class="form-control" type="password" name="password" required>
            </div>
            <button type="submit">
                <i class="fas fa-right-to-bracket me-2"></i>
                Đăng nhập
            </button>
        </form>
    </section>
</main>
</body>
</html>
