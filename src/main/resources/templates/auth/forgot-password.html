<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - OTIO System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/features/auth.css}">
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon-box">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2 class="auth-title">Quên Mật Khẩu?</h2>
        <p class="auth-subtitle">Nhập địa chỉ Email đăng ký của bạn. Hệ thống sẽ gửi mã OTP xác nhận có hiệu lực trong vòng <strong>5 phút</strong>.</p>
    </div>

    <div th:if="${errorMessage != null}" class="alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMessage}">Lỗi xử lý</span>
    </div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label class="form-label">Địa chỉ Email đăng ký</label>
            <input type="email" name="email" class="form-control" placeholder="vd: user@example.com" th:value="${email}" required autofocus>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-paper-plane me-2"></i> Gửi Mã OTP Qua Gmail
        </button>
    </form>

    <a th:href="@{/login}" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang Đăng nhập
    </a>
</div>

</body>
</html>
