<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực OTP - OTIO System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --green: #008a45;
            --green-dark: #006b35;
            --ink: #101923;
            --muted: #667789;
            --line: #dfe7e2;
            --page: #f4f8f6;
            --danger: #b42318;
            --danger-bg: #fef3f2;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: var(--page);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: min(460px, 100%);
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #e0f2fe;
            color: #0284c7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 16px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--ink);
            margin: 0 0 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
            margin: 0;
        }

        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fef3c7;
            color: #b45309;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 12px;
        }

        .otp-input {
            width: 100%;
            height: 54px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 12px;
            text-align: center;
            border: 2px solid var(--line);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .otp-input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 138, 69, 0.15);
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: var(--green);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: var(--green-dark);
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .alert-error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #fecdca;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--green);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon-box">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="auth-title">Nhập Mã OTP</h2>
        <p class="auth-subtitle">Chúng tôi đã gửi mã xác nhận 6 chữ số tới:<br><strong th:text="${email}">email@example.com</strong></p>
        
        <div class="timer-badge">
            <i class="fa-regular fa-clock"></i>
            Hạn mã OTP: <span id="countdown">05:00</span>
        </div>
    </div>

    <div th:if="${successMessage != null}" class="alert-success" th:text="${successMessage}">
        Thông báo thành công
    </div>

    <div th:if="${errorMessage != null}" class="alert-error" th:text="${errorMessage}">
        Lỗi mã OTP
    </div>

    <form th:action="@{/verify-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        
        <div style="margin-bottom: 16px;">
            <input type="text" name="otpCode" class="otp-input" placeholder="000000" maxlength="6" th:value="${otpCode}" required autofocus autocomplete="off">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fa-solid fa-circle-check me-2"></i> Xác Nhận Mã OTP
        </button>
    </form>

    <div style="text-align: center; margin-top: 18px;">
        <a th:href="@{/forgot-password(email=${email})}" style="font-size: 13px; font-weight: 700; color: var(--green); text-decoration: none;">
            <i class="fa-solid fa-rotate-right me-1"></i> Chưa nhận được mã? Gửi lại OTP
        </a>
    </div>

    <a th:href="@{/login}" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i> Hủy và quay lại trang Đăng nhập
    </a>
</div>

<script>
    // 5-minute Countdown Timer (300 seconds)
    let timeLeft = 300;
    const countdownEl = document.getElementById('countdown');
    const submitBtn = document.getElementById('submitBtn');

    const timer = setInterval(() => {
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        countdownEl.textContent = `${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = "HẾT HẠN!";
            countdownEl.parentElement.style.background = "#fef2f2";
            countdownEl.parentElement.style.color = "#dc2626";
        }
    }, 1000);
</script>

</body>
</html>
