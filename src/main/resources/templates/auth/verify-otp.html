<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực OTP - OTIO System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/features/auth.css}">
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon-box">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="auth-title">Nhập Mã OTP</h2>
        <p class="auth-subtitle">Chúng tôi đã gửi mã xác nhận 6 chữ số tới:<br><strong th:text="${email}">email@example.com</strong></p>
        
        <div class="timer-badge">
            <i class="fa-regular fa-clock"></i>
            Hạn mã OTP: <span id="countdown">05:00</span>
        </div>
    </div>

    <div th:if="${successMessage != null}" class="alert-success" th:text="${successMessage}">
        Thông báo thành công
    </div>

    <div th:if="${errorMessage != null}" class="alert-error" th:text="${errorMessage}">
        Lỗi mã OTP
    </div>

    <form th:action="@{/verify-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        
        <div class="extracted-auth-verify-otp-045aac89">
            <input type="text" name="otpCode" class="otp-input" placeholder="000000" maxlength="6" th:value="${otpCode}" required autofocus autocomplete="off">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fa-solid fa-circle-check me-2"></i> Xác Nhận Mã OTP
        </button>
    </form>

    <div class="extracted-auth-verify-otp-3d588666">
        <a class="extracted-auth-verify-otp-4031cf4d" th:href="@{/forgot-password(email=${email})}">
            <i class="fa-solid fa-rotate-right me-1"></i> Chưa nhận được mã? Gửi lại OTP
        </a>
    </div>

    <a th:href="@{/login}" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i> Hủy và quay lại trang Đăng nhập
    </a>
</div>

<script>
    // 5-minute Countdown Timer (300 seconds)
    let timeLeft = 300;
    const countdownEl = document.getElementById('countdown');
    const submitBtn = document.getElementById('submitBtn');

    const timer = setInterval(() => {
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        countdownEl.textContent = `${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = "HẾT HẠN!";
            countdownEl.parentElement.style.background = "#fef2f2";
            countdownEl.parentElement.style.color = "#dc2626";
        }
    }, 1000);
</script>

</body>
</html>
