<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - OTIO System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --green: #008a45;
            --green-dark: #006b35;
            --ink: #101923;
            --muted: #667789;
            --line: #dfe7e2;
            --page: #f4f8f6;
            --danger: #b42318;
            --danger-bg: #fef3f2;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: var(--page);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: min(460px, 100%);
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #dcfce7;
            color: var(--green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 16px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--ink);
            margin: 0 0 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 138, 69, 0.15);
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: var(--green);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--green-dark);
        }

        .alert-error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #fecdca;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--green);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon-box">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="auth-title">Tạo Mật Khẩu Mới</h2>
        <p class="auth-subtitle">Nhập mật khẩu mới bảo mật cho tài khoản:<br><strong th:text="${email}">user@example.com</strong></p>
    </div>

    <div th:if="${errorMessage != null}" class="alert-error" th:text="${errorMessage}">
        Lỗi xảy ra
    </div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" name="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label">Xác nhận mật khẩu mới</label>
            <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-floppy-disk me-2"></i> Lưu Mật Khẩu Mới
        </button>
    </form>

    <a th:href="@{/login}" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i> Hủy và quay lại trang Đăng nhập
    </a>
</div>

</body>
</html>
