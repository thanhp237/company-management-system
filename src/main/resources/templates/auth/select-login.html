<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chọn loại đăng nhập</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .login-container{
            width:900px;
            max-width:95%;
        }

        .login-card{
            border:none;
            border-radius:18px;
            transition:.25s;
            cursor:pointer;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .login-card:hover{
            transform:translateY(-6px);
            box-shadow:0 15px 35px rgba(0,0,0,.15);
        }

        .icon{
            font-size:60px;
            color:#0d6efd;
        }

        .btn-login{
            width:100%;
        }

        h1{
            font-weight:700;
        }

    </style>

</head>

<body>

<div class="container login-container">

    <div class="text-center mb-5">

        <h1>Bạn muốn đăng nhập bằng vai trò nào?</h1>

        <p class="text-muted">
            Chọn cổng phù hợp để truy cập hệ thống.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card login-card h-100">

                <div class="card-body text-center p-5">

                    <i class="bi bi-person-workspace icon"></i>

                    <h3 class="mt-4">
                        Nhân viên
                    </h3>

                    <p class="text-muted">
                        Đăng nhập vào hệ thống quản lý nội bộ.
                    </p>

                    <a th:href="@{/login}"
                       class="btn btn-primary btn-lg btn-login">

                        Đăng nhập nhân viên

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card login-card h-100">

                <div class="card-body text-center p-5">

                    <i class="bi bi-person-circle icon"></i>

                    <h3 class="mt-4">
                        Khách hàng
                    </h3>

                    <p class="text-muted">
                        Truy cập cổng khách hàng để xem và ký hợp đồng.
                    </p>

                    <a th:href="@{/customer/login}"
                       class="btn btn-outline-primary btn-lg btn-login">

                        Đăng nhập khách hàng

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
