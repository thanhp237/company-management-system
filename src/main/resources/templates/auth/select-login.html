<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Select Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-container{
            width:900px;
            max-width:95%;
        }

        .login-card{
            border:none;
            border-radius:18px;
            transition:.25s;
            cursor:pointer;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .login-card:hover{
            transform:translateY(-6px);
            box-shadow:0 15px 35px rgba(0,0,0,.15);
        }

        .icon{
            font-size:60px;
            color:#0d6efd;
        }

        .btn-login{
            width:100%;
        }

        h1{
            font-weight:700;
        }

    </style>

</head>

<body>

<div class="container login-container">

    <div class="text-center mb-5">

        <h1>Who are you?</h1>

        <p class="text-muted">
            Please choose how you want to access the system.
        </p>

    </div>

    <div class="row g-4">

        <!-- Employee -->

        <div class="col-md-6">

            <div class="card login-card h-100">

                <div class="card-body text-center p-5">

                    <i class="bi bi-person-workspace icon"></i>

                    <h3 class="mt-4">
                        Employee
                    </h3>

                    <p class="text-muted">
                        Login to the internal Company Management System.
                    </p>

                    <a th:href="@{/login}"
                       class="btn btn-primary btn-lg btn-login">

                        Employee Login

                    </a>

                </div>

            </div>

        </div>

        <!-- Customer -->

        <div class="col-md-6">

            <div class="card login-card h-100">

                <div class="card-body text-center p-5">

                    <i class="bi bi-person-circle icon"></i>

                    <h3 class="mt-4">
                        Customer
                    </h3>

                    <p class="text-muted">
                        Access your customer portal to manage contracts and services.
                    </p>

                    <a th:href="@{/customer/login}"
                       class="btn btn-outline-primary btn-lg btn-login">

                        Customer Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
