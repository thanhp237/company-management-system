<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển khách hàng - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
    <link rel="stylesheet" th:href="@{/css/features/dashboard.css}">
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>

<main class="customer-dashboard-shell customer-app-content">
    <div class="customer-dashboard">
        <section class="customer-hero">
            <div>
                <p class="management-eyebrow">Cổng khách hàng</p>
                <h1>Bảng điều khiển khách hàng</h1>
                <p>Xin chào <strong sec:authentication="name">customer</strong>, đây là khu vực theo dõi báo giá, hợp đồng và thanh toán của bạn.</p>
            </div>
            <span class="customer-chip">
                <i class="fas fa-user"></i>
                Khách hàng
            </span>
        </section>

        <section class="customer-kpi-grid">
            <article class="customer-card" th:each="card : ${kpiCards}">
                <i class="fas" th:classappend="${card.icon}"></i>
                <strong th:text="${card.value}">0</strong>
                <span th:text="${card.label}">Chỉ số</span>
                <small th:text="${card.caption}">Ghi chú</small>
            </article>
        </section>

        <div class="customer-work-grid">
            <section class="customer-action-panel" th:each="group : ${actionGroups}">
                <div class="customer-panel-header">
                    <h2 th:text="${group.title}">Khu vực làm việc</h2>
                    <p th:text="${group.description}">Mô tả</p>
                </div>
                <div class="customer-actions">
                    <a class="customer-action"
                       th:each="action : ${group.actions}"
                       th:href="${action.href}">
                        <i class="fas" th:classappend="${action.icon}"></i>
                        <span>
                            <strong th:text="${action.label}">Thao tác</strong>
                            <small th:text="${action.description}">Mô tả</small>
                        </span>
                    </a>
                </div>
            </section>

            <aside class="customer-insight-panel">
                <div class="customer-panel-header">
                    <h2>Phạm vi truy cập</h2>
                    <p>Khách hàng chỉ nhìn thấy dữ liệu cổng thông tin của chính mình.</p>
                </div>
                <div class="customer-insights">
                    <div class="customer-insight" th:each="item : ${insightItems}">
                        <strong th:text="${item.title}">Gợi ý</strong>
                        <span th:text="${item.description}">Mô tả</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</main>

</body>
</html>
