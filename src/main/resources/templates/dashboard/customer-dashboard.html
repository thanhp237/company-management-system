<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển khách hàng - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/main.css}">
    <style>
        .customer-dashboard-shell {
            min-height: calc(100vh - 72px);
            padding: 28px;
            background: linear-gradient(180deg, rgba(250, 253, 250, 0.98), rgba(242, 247, 244, 0.98));
        }

        .customer-dashboard {
            width: min(1060px, 100%);
            margin: 0 auto;
        }

        .customer-hero,
        .customer-card,
        .customer-insight-panel {
            border: 1px solid #dfe7e2;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 42px rgba(31, 45, 57, 0.08);
        }

        .customer-hero {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
            padding: 22px;
        }

        .customer-hero h1 {
            margin: 0;
            color: #101923;
            font-size: 30px;
            font-weight: 900;
        }

        .customer-hero p {
            margin: 8px 0 0;
            color: #596a7a;
        }

        .customer-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            background: #e8f3ff;
            color: #1c69b3;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .customer-kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .customer-card {
            padding: 18px;
        }

        .customer-card i {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            margin-bottom: 14px;
            border-radius: 8px;
            background: #e5f8ec;
            color: #007a3d;
        }

        .customer-card strong {
            display: block;
            color: #101923;
            font-size: 26px;
            font-weight: 900;
        }

        .customer-card span,
        .customer-card small {
            display: block;
        }

        .customer-card span {
            margin-top: 8px;
            color: #405366;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .customer-card small {
            margin-top: 6px;
            color: #657386;
            font-size: 12px;
            line-height: 1.45;
        }

        .customer-work-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 18px;
            align-items: start;
        }

        .customer-action-panel,
        .customer-insight-panel {
            overflow: hidden;
        }

        .customer-panel-header {
            padding: 18px;
            border-bottom: 1px solid #edf1ee;
            background: #f7faf8;
        }

        .customer-panel-header h2 {
            margin: 0;
            color: #101923;
            font-size: 18px;
            font-weight: 900;
        }

        .customer-panel-header p {
            margin: 4px 0 0;
            color: #657386;
            font-size: 13px;
        }

        .customer-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 18px;
            border: 1px solid #dfe7e2;
            border-top: 0;
            border-radius: 0 0 8px 8px;
            background: #fff;
        }

        .customer-action {
            display: flex;
            gap: 12px;
            min-height: 92px;
            padding: 14px;
            border: 1px solid #dfe7e2;
            border-radius: 8px;
            color: #17202b;
        }

        .customer-action:hover {
            border-color: #bfe6cf;
            background: #f5fbf7;
            color: #007a3d;
        }

        .customer-action i {
            flex: 0 0 auto;
            color: #007a3d;
            margin-top: 2px;
        }

        .customer-action strong,
        .customer-insight strong {
            display: block;
            font-size: 14px;
            font-weight: 900;
        }

        .customer-action small,
        .customer-insight span {
            display: block;
            margin-top: 5px;
            color: #657386;
            font-size: 12px;
            line-height: 1.45;
        }

        .customer-insights {
            display: grid;
            gap: 12px;
            padding: 18px;
        }

        .customer-insight {
            padding: 14px;
            border: 1px solid #edf1ee;
            border-radius: 8px;
            background: #fbfdfb;
        }

        @media (max-width: 840px) {
            .customer-kpi-grid,
            .customer-work-grid,
            .customer-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/customer-sidebar :: customerLayout}"></th:block>

<main class="customer-dashboard-shell customer-app-content">
    <div class="customer-dashboard">
        <section class="customer-hero">
            <div>
                <p class="management-eyebrow">Cổng khách hàng</p>
                <h1>Bảng điều khiển khách hàng</h1>
                <p>Xin chào <strong sec:authentication="name">customer</strong>, đây là khu vực theo dõi báo giá, hợp đồng và thanh toán của bạn.</p>
            </div>
            <span class="customer-chip">
                <i class="fas fa-user"></i>
                Khách hàng
            </span>
        </section>

        <section class="customer-kpi-grid">
            <article class="customer-card" th:each="card : ${kpiCards}">
                <i class="fas" th:classappend="${card.icon}"></i>
                <strong th:text="${card.value}">0</strong>
                <span th:text="${card.label}">Chỉ số</span>
                <small th:text="${card.caption}">Ghi chú</small>
            </article>
        </section>

        <div class="customer-work-grid">
            <section class="customer-action-panel" th:each="group : ${actionGroups}">
                <div class="customer-panel-header">
                    <h2 th:text="${group.title}">Khu vực làm việc</h2>
                    <p th:text="${group.description}">Mô tả</p>
                </div>
                <div class="customer-actions">
                    <a class="customer-action"
                       th:each="action : ${group.actions}"
                       th:href="${action.href}">
                        <i class="fas" th:classappend="${action.icon}"></i>
                        <span>
                            <strong th:text="${action.label}">Thao tác</strong>
                            <small th:text="${action.description}">Mô tả</small>
                        </span>
                    </a>
                </div>
            </section>

            <aside class="customer-insight-panel">
                <div class="customer-panel-header">
                    <h2>Phạm vi truy cập</h2>
                    <p>Khách hàng chỉ nhìn thấy dữ liệu cổng thông tin của chính mình.</p>
                </div>
                <div class="customer-insights">
                    <div class="customer-insight" th:each="item : ${insightItems}">
                        <strong th:text="${item.title}">Gợi ý</strong>
                        <span th:text="${item.description}">Mô tả</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</main>

</body>
</html>
