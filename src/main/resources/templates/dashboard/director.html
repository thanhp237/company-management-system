<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director Dashboard</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #212121; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .badge { background: #d4a017; color: #000; padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; }
    p { color: #bbb; font-size: 1rem; margin: 0; }
  </style>
</head>
<body>
  <div class="badge">Role: Director</div>
  <h1>Director Dashboard</h1>
  <p>Company-wide overview — performance, teams, and strategic metrics.</p>
</body>
</html>
