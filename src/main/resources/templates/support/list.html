<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ giúp thanh toán - CompanyMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <style>
        body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .support-ticket-grid { display: grid; gap: 16px; }
        .support-ticket { border: 1px solid #dfe7e2; border-radius: 8px; background: #fff; padding: 18px; box-shadow: 0 12px 28px rgba(31, 45, 57, 0.07); overflow: hidden; }
        .support-ticket-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
        .support-ticket-head h2 { margin: 0; font-size: 20px; font-weight: 900; color: #101923; }
        .support-ticket-meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 12px 0; color: #657386; font-size: 13px; }
        .support-ticket-content { color: #263746; white-space: pre-wrap; }
        .support-evidence { max-width: 360px; width: 100%; border-radius: 8px; border: 1px solid #dfe7e2; margin-top: 12px; object-fit: cover; }
        .support-ticket-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8eee9; }
        .support-ticket-actions form { margin: 0; }
        .support-ticket-actions .btn { min-height: 38px; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; border-radius: 8px; white-space: nowrap; }
        @media (max-width: 720px) {
            .support-ticket-head { flex-direction: column; }
            .support-ticket-actions { flex-direction: column; align-items: stretch; }
            .support-ticket-actions .btn, .support-ticket-actions form, .support-ticket-actions button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<th:block th:insert="~{layouts/navbar}"></th:block>
<div sec:authorize="isAuthenticated()">
    <th:block th:insert="~{layouts/sidebar}"></th:block>
</div>

<main class="admin-workspace with-sidebar">
    <div class="management-page">
        <div class="management-taskbar">
            <div>
                <p class="management-eyebrow">Hỗ trợ khách hàng</p>
                <h1>Trợ giúp thanh toán</h1>
                <p class="management-subtitle">Theo dõi các yêu cầu khi khách đã thanh toán VNPAY nhưng hóa đơn chưa cập nhật thành công.</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="management-alert success">
            <i class="fas fa-circle-check"></i>
            <span th:text="${successMessage}">Đã cập nhật.</span>
        </div>
        <div th:if="${errorMessage}" class="management-alert danger">
            <i class="fas fa-circle-exclamation"></i>
            <span th:text="${errorMessage}">Có lỗi xảy ra.</span>
        </div>

        <section class="support-ticket-grid">
            <article class="support-ticket" th:each="ticket : ${tickets}">
                <div class="support-ticket-head">
                    <div>
                        <h2 th:text="${ticket.title}">Tiêu đề hỗ trợ</h2>
                        <div class="support-ticket-meta">
                            <span>
                                <i class="fas fa-user"></i>
                                <strong th:text="${ticket.customer.fullName != null ? ticket.customer.fullName : ticket.customer.email}">Khách hàng</strong>
                            </span>
                            <span>
                                <i class="fas fa-file-invoice-dollar"></i>
                                <strong th:text="${ticket.invoice.invoiceCode}">INV</strong>
                            </span>
                            <span>
                                <i class="fas fa-clock"></i>
                                <strong th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày gửi</strong>
                            </span>
                        </div>
                    </div>
                    <span class="badge"
                          th:classappend="${ticket.status.name() == 'OPEN'} ? ' text-bg-warning' : ' text-bg-success'"
                          th:text="${ticket.status.name() == 'OPEN' ? 'Đang chờ xử lý' : 'Đã xử lý'}">Đang chờ xử lý</span>
                </div>

                <p class="support-ticket-content" th:text="${ticket.content}">Nội dung hỗ trợ</p>
                <a th:if="${ticket.imageUrl != null and !#strings.isEmpty(ticket.imageUrl)}"
                   th:href="${ticket.imageUrl}"
                   target="_blank"
                   rel="noopener">
                    <img class="support-evidence" th:src="${ticket.imageUrl}" alt="Ảnh minh chứng thanh toán">
                </a>

                <div class="support-ticket-actions">
                    <a class="btn btn-outline-primary"
                       th:href="@{/invoices/detail/{id}(id=${ticket.invoice.id})}">
                        <i class="fas fa-file-invoice-dollar"></i>
                        Mở hóa đơn
                    </a>
                    <form th:if="${ticket.status.name() == 'OPEN'}"
                          th:action="@{/support/{id}/resolve(id=${ticket.id})}"
                          method="post">
                        <button class="btn btn-outline-success" type="submit">
                            <i class="fas fa-check"></i>
                            Đánh dấu đã xử lý
                        </button>
                    </form>
                </div>
            </article>

            <div th:if="${#lists.isEmpty(tickets)}" class="support-ticket text-center text-muted">
                Chưa có yêu cầu hỗ trợ thanh toán.
            </div>
        </section>
    </div>
</main>
</body>
</html>
