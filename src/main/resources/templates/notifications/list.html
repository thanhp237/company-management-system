<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .notification-item {
            transition: all 0.2s ease;
            border-left: 4px solid #transparent;
        }
        /* Mốc phân biệt thông báo chưa đọc: Nền xanh nhạt, vạch xanh đậm cạnh bên */
        .notification-unread {
            background-color: #f0f7ff;
            border-left-color: #0d6efd;
        }
        .notification-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-dark m-0">
                    <i class="fas fa-bell text-primary me-2"></i>Thông báo của tôi
                </h3>
                <a href="/dashboard" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại Dashboard
                </a>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-0">
                    
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                        <i class="far fa-bell-slash fa-3x mb-3 text-black-50"></i>
                        <p class="m-0">Hộp thông báo của bạn đang trống.</p>
                    </div>

                    <div th:if="${!#lists.isEmpty(notifications)}">
                        <div th:each="noti : ${notifications}" 
                             th:id="'noti-row-' + ${noti.id}"
                             class="notification-item p-3 border-bottom d-flex justify-content-between align-items-start"
                             th:classappend="${!noti.isRead} ? 'notification-unread' : ''">
                            
                            <div class="d-flex gap-3">
                                <div class="mt-1">
                                    <i th:class="${!noti.isRead} ? 'fas fa-circle text-primary fs-6' : 'far fa-circle text-secondary fs-6'"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-1 text-dark" th:text="${noti.title}">Tiêu đề</h6>
                                    <p class="text-secondary mb-1" style="font-size: 14px;" th:text="${noti.message}">Nội dung chi tiết</p>
                                    <small class="text-muted" style="font-size: 11px;">
                                        <i class="far fa-clock me-1"></i>
                                        <span th:text="${#temporals.format(noti.createdAt, 'HH:mm - dd/MM/yyyy')}">Thời gian</span>
                                    </small>
                                </div>
                            </div>

                            <div th:if="${!noti.isRead}">
                                <button th:onclick="'markAsReadInPage(' + ${noti.id} + ')'" 
                                        class="btn btn-light btn-sm text-primary border rounded-pill" 
                                        style="font-size: 11px;">
                                    <i class="fas fa-check me-1"></i> Đọc xong
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
function markAsReadInPage(notiId) {
    fetch('/api/notifications/' + notiId + '/read', { method: 'POST' })
        .then(response => {
            if (response.ok) {
                // Đổi giao diện dòng đó thành trạng thái đã đọc tức thì
                const row = document.getElementById('noti-row-' + notiId);
                if (row) {
                    row.classList.remove('notification-unread');
                    // Ẩn luôn chiếc nút "Đọc xong"
                    const btn = row.querySelector('button');
                    if (btn) btn.remove();
                    // Thay đổi icon vòng tròn từ đặc sang rỗng
                    const icon = row.querySelector('.fa-circle');
                    if (icon) {
                        icon.className = 'far fa-circle text-secondary fs-6';
                    }
                }
            }
        })
        .catch(err => console.error('Lỗi cập nhật trạng thái:', err));
}
</script>

</body>
</html>
